<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Simulados e estudo para concursos de Porto Velho, com foco no cargo de Agente de Secretaria Escolar.">
<title>Gabarito Mamoré</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: uma coluna de trabalho, estilo folha de respostas. Bolhas A-E como no cartão da prova, tinta azul/preta. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#111a33; --muted:#566079; --line:#d8deeb;
  --accent:#2340d9; --accent-ink:#ffffff; --accent-soft:#e5e9fc;
  --ok:#0f7a58; --ok-soft:#d9f2e8; --bad:#be301d; --bad-soft:#fbe2de; --warn:#9a5600; --warn-soft:#fcebcb;
  --f-display:'Geist','Segoe UI',system-ui,sans-serif;
  --f-body:'Geist','Segoe UI',system-ui,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1224; --surface:#151d36; --ink:#e8ecf8; --muted:#9aa5c2; --line:#27304d;
    --accent:#8296ff; --accent-ink:#0c1224; --accent-soft:#1e2750;
    --ok:#46d3a1; --ok-soft:#12372d; --bad:#ff8c7a; --bad-soft:#40201b; --warn:#f2b45b; --warn-soft:#3a2b10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1224; --surface:#151d36; --ink:#e8ecf8; --muted:#9aa5c2; --line:#27304d;
  --accent:#8296ff; --accent-ink:#0c1224; --accent-soft:#1e2750;
  --ok:#46d3a1; --ok-soft:#12372d; --bad:#ff8c7a; --bad-soft:#40201b; --warn:#f2b45b; --warn-soft:#3a2b10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font:700 26px/1 var(--f-display);letter-spacing:-.045em}
.logo{display:block;flex:none}
.logo .st{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.logo .fl{fill:var(--ink);stroke:var(--ink);stroke-linejoin:round}
.logo .ac{fill:var(--accent);stroke:var(--accent);stroke-linejoin:round}
.logo .ck{fill:none;stroke:var(--accent-ink);stroke-linecap:round;stroke-linejoin:round}
.brand span{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.theme{gap:8px;font-size:14px}
.theme svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.menu-btn:hover{background:var(--line)}
.menu-btn svg{display:block}
.top .brand{flex:1;min-width:0}
.tabs{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:60;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--bg);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.18);overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
body.menu-open .tabs{transform:none;visibility:visible;transition:transform .22s ease}
.tabs .tabs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45)}
.scrim[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .tabs{transition:none} }
.tabs a{padding:12px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:16px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:10px}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 40px;align-items:end;margin-bottom:36px}
.hero .lead{font-size:18px;color:var(--muted);max-width:52ch;margin-top:12px}
.count{border-left:4px solid var(--ink);padding-left:20px}
.count .big{font:700 clamp(64px,11vw,104px)/0.95 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count .lbl{font-weight:600;margin-top:6px}
.count .sub{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:420px}
.tbl th{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tfoot td{font-weight:700;border-bottom:0}
.sec{margin-top:36px}
.sec>h2{margin-bottom:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.act{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;cursor:pointer;text-align:left}
.act:hover{border-color:var(--ink)}
.act b{font:600 18px var(--f-display)}
.act span{color:var(--muted);font-size:15px}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:14px 16px;border-radius:0 10px 10px 0;font-size:15px}
.note b{display:block;margin-bottom:2px}

/* questão */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.qn{font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.qm{font:500 13px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.txt-box{border-left:3px solid var(--line);padding:2px 0 2px 16px;margin:0 0 16px;color:var(--muted);font-size:17px;max-width:68ch}
.txt-box .eyebrow{display:block;margin-bottom:4px}
.enun{font-size:18px;font-weight:500;margin-bottom:18px;max-width:68ch}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.alt:hover{border-color:var(--muted)}
.alt[data-lock]{cursor:default}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:-1px}
.alt .t{padding-top:2px;min-width:0}
.alt.sel{border-color:var(--ink);background:var(--accent-soft)}
.alt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alt.ok{border-color:var(--ok);background:var(--ok-soft)}
.alt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.alt.bad{border-color:var(--bad);background:var(--bad-soft)}
.alt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.alt.dim{opacity:.62}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);max-width:68ch}
.fb b{display:block;margin-bottom:4px}
.fb.good b{color:var(--ok)} .fb.wrong b{color:var(--bad)} .fb.none b{color:var(--warn)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* simulado */
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:10px 0 14px;margin-bottom:6px}
.timer small{display:block;font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.timer b{font:600 30px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.prog{font-size:15px;color:var(--muted)} .prog b{color:var(--ink);font-family:var(--f-mono)}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.navgrid button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);cursor:pointer;padding:0;position:relative}
.navgrid button.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navgrid button.m::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.navgrid button.c{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--ink);border-color:var(--ink)} .legend i.m{background:var(--warn);border-radius:50%;border-color:var(--warn)}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.confirm{margin-top:18px;padding:16px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px}
.confirm p{margin-bottom:12px}

/* resultado */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score .n{font:700 clamp(56px,10vw,88px)/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .of{font:500 22px var(--f-mono);color:var(--muted)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar .h{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:5px}
.bar .h span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.fill.low{background:var(--warn)}
.rev{display:flex;flex-direction:column;gap:8px}
details.r{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.r>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;list-style:none}
details.r>summary::-webkit-details-marker{display:none}
details.r[open]>summary{border-bottom:1px solid var(--line)}
details.r .body{padding:18px 14px}
.tag{font:600 12px var(--f-mono);padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.none{background:var(--warn-soft);color:var(--warn)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hist{display:flex;flex-direction:column}
.hist .li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* cadastro, conta, bancas */
.form{display:flex;flex-direction:column;gap:18px;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.inp{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.inp:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea.inp{min-height:200px;font-family:var(--f-mono);font-size:12px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.err{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:24px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:15px;z-index:20}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bcard{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.bcard:hover{border-color:var(--ink)}
.bcard b{font:700 22px var(--f-display);letter-spacing:-.03em}
.bcard span.s{color:var(--muted);font-size:14px}
.chip.on{background:var(--ok-soft);color:var(--ok)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip{align-self:flex-start;font-size:12px;padding:3px 10px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rules li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.rules li::before{content:"○";font-family:var(--f-mono)}
.rules li.ok{color:var(--ok)} .rules li.ok::before{content:"✓"}
.soc{display:flex;flex-direction:column;gap:10px}
.soc .btn[disabled]{justify-content:space-between;width:100%}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--f-mono);white-space:nowrap;vertical-align:1px}
.badge.soon{background:var(--accent-soft);color:var(--accent)} .badge.off{background:var(--warn-soft);color:var(--warn)}
.aulad{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.aulad>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.aula{margin-top:12px;max-width:68ch;font-size:16px}
.topic .aula p{margin:0 0 12px;color:var(--ink);font-size:16px}
.aula ul{margin:0 0 12px;padding-left:20px}
.aula li{margin-bottom:6px}
.tlink{font:600 17px/1.3 var(--f-body);color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.tlink:hover{text-decoration-color:var(--ink)}
.badge.on{background:var(--ok-soft);color:var(--ok)}
.tsec{margin-top:30px}
.tsec>h2{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tsec .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);font:600 14px var(--f-mono)}
.aula-p{max-width:68ch;margin-bottom:14px}
.tsec .aula{max-width:68ch;font-size:17px}
.tsec .aula p{margin:0 0 14px}
.tsec .aula ul{margin:0 0 14px;padding-left:20px}
.tsec .aula li{margin-bottom:8px}
.topics{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.topic.done{background:var(--ok-soft);border-color:var(--ok)}
.topic b{font-weight:600}
.topic p{color:var(--muted);font-size:15px;margin-top:4px;max-width:68ch}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--bg);cursor:pointer;display:grid;place-items:center;font:700 16px var(--f-mono);color:var(--surface);padding:0}
.topic.done .tick{background:var(--ok);border-color:var(--ok)}
.policy h2{font-size:18px;margin:26px 0 8px}
.policy p,.policy li{max-width:68ch}
.policy ul{margin:8px 0;padding-left:20px}
details.pol{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:20px;max-width:560px}
details.pol>summary{cursor:pointer;padding:14px 18px;font-weight:600}
details.pol .policy{padding:0 18px 18px}

.enun,.txt-box{white-space:pre-line}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .simwrap{grid-template-columns:1fr}
  aside.side{position:static}
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .5s ease} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="menu-btn" id="menu-open" type="button" data-act="menu" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="10" cy="3.5" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="10" cy="16.5" r="2"/></svg></button>
    <div class="brand">
      <svg class="logo" width="56" height="42" viewBox="0 0 132 100" role="img" aria-label="Três caixas d'água de Porto Velho, a última marcada como bolha de gabarito">
        <path class="st" d="M4 92 H128" stroke-width="6"/>
        <path class="st" d="M11 48 L5 90 M33 48 L39 90 M55 48 L49 90 M77 48 L83 90 M99 48 L93 90 M121 48 L127 90" stroke-width="6"/>
        <rect class="st" x="7" y="22" width="30" height="26" rx="5" stroke-width="6"/>
        <rect class="st" x="51" y="22" width="30" height="26" rx="5" stroke-width="6"/>
        <path class="fl" d="M7 22 L22 9 L37 22 Z M51 22 L66 9 L81 22 Z" stroke-width="3"/>
        <rect class="ac" x="95" y="22" width="30" height="26" rx="5" stroke-width="6"/>
        <path class="ac" d="M95 22 L110 9 L125 22 Z" stroke-width="3"/>
        <path class="ck" d="M102 36 L108 42 L119 29" stroke-width="6"/>
      </svg>
      <b>Gabarito Mamoré</b><span>Porto Velho · Nível médio</span></div>
    <nav class="tabs" id="menu" aria-label="Seções">
      <div class="tabs-h"><span>Menu</span><button class="menu-btn" type="button" data-act="menu" aria-label="Fechar menu">✕</button></div>
      <a href="#inicio" data-v="inicio">Início</a>
      <a href="#bancas" data-v="bancas">Bancas</a>
      <a href="#concursos" data-v="concursos">Concursos</a>
      <a href="#estudar" data-v="estudar">Estudar</a>
      <a href="#simulado" data-v="simulado">Simulado</a>
      <a href="#treino" data-v="treino">Treino</a>
      <a href="#erros" data-v="erros">Meus erros</a>
      <a href="#desempenho" data-v="desempenho">Desempenho</a>
      <a href="#conta" data-v="conta">Conta</a>

<script>
/* ===== Dados ===== */
const MAT = {
  pt:{n:'Língua Portuguesa'},
  rl:{n:'Raciocínio Lógico'},
  cg:{n:'Conhecimentos Gerais e Atualidades'},
  lg:{n:'Legislação'},
  ce:{n:'Conhecimentos Específicos'}
};
const T = {
  t1:'A secretaria escolar é, muitas vezes, o primeiro lugar que as famílias procuram ao chegar à escola. É ali que se faz a matrícula, que se pede um documento, que se tira uma dúvida. Por isso, o atendimento cordial e a organização dos registros não são detalhes: são a face mais visível do compromisso da escola com quem ela atende.'
};
/* Questões originais, escritas no formato do Anexo III (5 alternativas, 1 correta). g = índice da correta. */
const QS = [
/* Língua Portuguesa */
{id:'pt1',m:'pt',e:'Assinale a alternativa em que a concordância verbal está de acordo com a norma-padrão.',a:['Fazem dois anos que a secretaria mudou de endereço.','Haviam muitos documentos sobre a mesa.','Devem existir outras soluções para o problema.','Houveram várias reclamações sobre o atendimento.','Existe muitas pendências no arquivo.'],g:2,x:'“Devem existir”: o verbo auxiliar concorda com o sujeito (“soluções”). Nas demais, “fazer” e “haver” com sentido de tempo ou de existência são impessoais (“Faz dois anos”, “Havia”, “Houve”), e “existir” concorda com o sujeito (“Existem”).'},
{id:'pt2',m:'pt',e:'Assinale a alternativa em que o uso do sinal indicativo de crase está CORRETO.',a:['Entreguei o relatório à ele.','Referiu-se à pessoas que não conhecia.','A diretora começou à falar.','Os alunos foram à secretaria retirar o histórico escolar.','Ficamos frente à frente com o diretor.'],g:3,x:'“Ir a” + “a secretaria” (palavra feminina com artigo) resulta em crase: “à secretaria”. Não há crase diante de pronome pessoal (“ele”), de palavra no plural sem artigo (“a pessoas”), de verbo (“a falar”) nem em expressões formadas por palavras repetidas (“frente a frente”).'},
{id:'pt3',m:'pt',t:'t1',e:'De acordo com o texto, o atendimento cordial e a organização dos registros',a:['são detalhes secundários diante das atividades pedagógicas.','mostram, de forma visível, o compromisso da escola com as pessoas que ela atende.','dependem exclusivamente da decisão da direção da escola.','interessam apenas às famílias que precisam fazer matrícula.','substituem a necessidade de outros serviços da escola.'],g:1,x:'O texto afirma que esses aspectos “não são detalhes: são a face mais visível do compromisso da escola com quem ela atende”.'},
{id:'pt4',m:'pt',t:'t1',e:'No texto, a expressão “Por isso” introduz uma ideia de',a:['oposição.','concessão.','condição.','finalidade.','conclusão.'],g:4,x:'“Por isso” retoma o que foi dito antes (a secretaria é a primeira porta de contato das famílias) e apresenta a consequência dessa ideia. Tem valor conclusivo.'},
{id:'pt5',m:'pt',e:'De acordo com as regras de acentuação gráfica vigentes, está CORRETA a grafia de:',a:['herói','assembléia','vôo','idéia','pára (verbo parar)'],g:0,x:'“Herói” é oxítona terminada em “ói” e leva acento. Depois do Acordo Ortográfico, perderam o acento “assembleia”, “ideia” (paroxítonas com ditongo aberto), “voo” (hiato “oo”) e “para” (verbo).'},
{id:'pt6',m:'pt',e:'Quanto à regência verbal, a frase que está de acordo com a norma-padrão é:',a:['Prefiro mais estudar do que dormir.','Aspiramos ao cargo de agente de secretaria escolar.','Assistimos o filme ontem à noite.','Esqueci-me os documentos em casa.','Obedeço os horários da escola.'],g:1,x:'“Aspirar” no sentido de desejar exige a preposição “a”: “aspirar ao cargo”. As demais ficam assim: “prefiro estudar a dormir”, “assistimos ao filme”, “esqueci os documentos” (ou “esqueci-me dos documentos”) e “obedeço aos horários”.'},
{id:'pt7',m:'pt',e:'Assinale a alternativa em que a vírgula está empregada de acordo com a norma-padrão.',a:['Os alunos, chegaram cedo à escola.','A secretária, que chegou cedo organizou os arquivos.','Ele disse, que viria amanhã.','Estudei muito mas, não passei.','Maria, entregue o documento ao diretor.'],g:4,x:'A vírgula isola o vocativo (“Maria”). Nas outras: não se separa sujeito e verbo (1ª), a oração explicativa exige duas vírgulas (2ª), não se separa o verbo da oração que o completa (3ª) e a vírgula vem antes de “mas” (4ª).'},
{id:'pt8',m:'pt',e:'Em “Aquela sala é um forno no verão”, ocorre a figura de linguagem denominada',a:['comparação.','ironia.','metáfora.','eufemismo.','antítese.'],g:2,x:'Há identificação direta entre “sala” e “forno”, sem conectivo comparativo (como, tal qual). Isso é metáfora.'},
{id:'pt9',m:'pt',e:'Assinale a alternativa em que a colocação do pronome átono está de acordo com a norma-padrão.',a:['Nunca me esqueci daquele dia.','Me entregue o documento hoje.','Ele disse que entregaria-me o documento.','Não entregaram-me o documento.','Quem disse-lhe isso?'],g:0,x:'Palavras negativas (“nunca”, “não”), pronomes interrogativos (“quem”) e conjunções subordinativas (“que”) atraem o pronome átono (próclise). Além disso, a norma-padrão não inicia frase com pronome átono. Forma correta das demais: “Entregue-me”, “Ele disse que me entregaria”, “Não me entregaram”, “Quem lhe disse isso?”.'},
{id:'pt10',m:'pt',e:'Está de acordo com a norma-padrão quanto à concordância nominal a frase:',a:['É proibida a entrada de estranhos na secretaria.','Seguem anexo as certidões solicitadas.','Ela mesmo preencheu a ficha de matrícula.','As salas estavam meias vazias.','Ela ficou muito obrigado pelo apoio.'],g:0,x:'Com artigo definido (“a entrada”), “proibida” concorda com o substantivo feminino. As outras corretas seriam: “seguem anexas as certidões”, “ela mesma”, “meio vazias” (“meio” é advérbio e não varia) e “muito obrigada”.'},
/* Raciocínio Lógico */
{id:'rl1',m:'rl',e:'Uma escola tem 480 alunos, dos quais 35% estudam no turno da manhã. Quantos alunos estudam nesse turno?',a:['128','148','158','168','178'],g:3,x:'480 × 0,35 = 168.'},
{id:'rl2',m:'rl',e:'Uma impressora produz 120 cópias em 6 minutos. Mantido o mesmo ritmo, quantas cópias ela produzirá em 15 minutos?',a:['200','240','300','330','360'],g:2,x:'Ritmo de 120 ÷ 6 = 20 cópias por minuto. Em 15 minutos: 20 × 15 = 300.'},
{id:'rl3',m:'rl',e:'Quatro servidores arquivam certa quantidade de processos em 6 dias. Mantido o mesmo ritmo individual, em quantos dias 8 servidores arquivariam a mesma quantidade?',a:['2','3','4','8','12'],g:1,x:'Mais servidores, menos dias: grandezas inversamente proporcionais. 4 × 6 = 8 × x, logo x = 3.'},
{id:'rl4',m:'rl',e:'Dois alarmes tocam juntos às 8h. Depois disso, um toca a cada 12 minutos e o outro a cada 18 minutos. Eles voltarão a tocar juntos às',a:['8h30.','8h36.','8h54.','9h00.','9h12.'],g:1,x:'O intervalo é o mínimo múltiplo comum: mmc(12, 18) = 36 minutos. 8h + 36 min = 8h36.'},
{id:'rl5',m:'rl',e:'Um candidato obteve as notas 6, 8 e 9, com pesos 2, 3 e 5, respectivamente. Sua média ponderada é',a:['7,3','7,7','8,0','8,1','8,3'],g:3,x:'(6×2 + 8×3 + 9×5) ÷ (2+3+5) = (12 + 24 + 45) ÷ 10 = 8,1.'},
{id:'rl6',m:'rl',e:'Um número somado ao seu triplo resulta em 84. Esse número é',a:['18','21','24','28','42'],g:1,x:'x + 3x = 84, então 4x = 84 e x = 21.'},
{id:'rl7',m:'rl',e:'A negação da proposição “Todos os documentos foram arquivados” é',a:['Pelo menos um documento não foi arquivado.','Nenhum documento foi arquivado.','Todos os documentos deixaram de ser arquivados.','Algum documento foi arquivado.','Poucos documentos foram arquivados.'],g:0,x:'A negação de “todo A é B” é “algum A não é B”, ou seja, pelo menos um documento não foi arquivado. “Nenhum” é mais forte do que a negação lógica.'},
{id:'rl8',m:'rl',e:'A proposição “Se chove, então a aula é suspensa” é logicamente equivalente a',a:['Se não chove, então a aula não é suspensa.','Se a aula é suspensa, então chove.','Chove e a aula não é suspensa.','Não chove ou a aula não é suspensa.','Se a aula não é suspensa, então não chove.'],g:4,x:'A condicional p → q equivale à contrapositiva ¬q → ¬p: “se a aula não é suspensa, então não chove”. A primeira alternativa é a inversa e a segunda é a recíproca; nenhuma delas é equivalente.'},
{id:'rl9',m:'rl',e:'Em um grupo de 50 servidores, 30 falam inglês, 25 falam espanhol e 10 falam os dois idiomas. Quantos servidores não falam nenhum dos dois idiomas?',a:['0','3','5','10','15'],g:2,x:'Falam pelo menos um: 30 + 25 − 10 = 45. Não falam nenhum: 50 − 45 = 5.'},
{id:'rl10',m:'rl',e:'Uma urna contém 4 bolas azuis, 3 vermelhas e 5 verdes. Retirando-se uma bola ao acaso, a probabilidade de que ela seja vermelha ou verde é',a:['1/3','5/12','7/12','2/3','3/4'],g:3,x:'Total de bolas: 4 + 3 + 5 = 12. Casos favoráveis: 3 + 5 = 8. Probabilidade: 8/12 = 2/3.'},
/* Conhecimentos Gerais */
{id:'cg1',m:'cg',e:'O município de Porto Velho, capital de Rondônia, está situado às margens do rio',a:['Madeira.','Purus.','Negro.','Tapajós.','Xingu.'],g:0,x:'Porto Velho fica às margens do rio Madeira, um dos grandes afluentes do rio Amazonas.'},
{id:'cg2',m:'cg',e:'A Estrada de Ferro Madeira-Mamoré, marco da história de Porto Velho, foi construída no início do século XX principalmente para',a:['ligar Porto Velho diretamente a Brasília.','transportar soja do Centro-Oeste até o porto de Santos.','escoar a borracha da região amazônica e boliviana, contornando trechos encachoeirados do rio Madeira.','unir as cidades de Manaus e Belém.','levar energia elétrica das usinas até as capitais do Norte.'],g:2,x:'A ferrovia foi criada para dar saída à borracha da Amazônia e da Bolívia, contornando as cachoeiras do rio Madeira. A cidade de Porto Velho nasceu ao redor dela.'},
{id:'cg3',m:'cg',e:'O nome do estado de Rondônia é uma homenagem a',a:['Euclides da Cunha.','Oswaldo Cruz.','Santos Dumont.','Getúlio Vargas.','Marechal Cândido Rondon.'],g:4,x:'O nome homenageia o Marechal Cândido Mariano da Silva Rondon, que explorou a região e chefiou a instalação de linhas telegráficas na Amazônia.'},
{id:'cg4',m:'cg',e:'De acordo com a Constituição Federal (art. 13, § 1º), são símbolos da República Federativa do Brasil:',a:['a bandeira, o hino, o brasão e a moeda.','a bandeira, o hino, as armas e o selo nacionais.','a bandeira, o hino e a Constituição.','a bandeira, o hino, o selo e o lema “Ordem e Progresso”.','apenas a bandeira e o hino.'],g:1,x:'O art. 13, § 1º, da Constituição: “São símbolos da República Federativa do Brasil a bandeira, o hino, as armas e o selo nacionais”.'},
{id:'cg5',m:'cg',e:'O bioma predominante no território do estado de Rondônia é',a:['a Caatinga.','o Pampa.','a Mata Atlântica.','a Amazônia.','o Pantanal.'],g:3,x:'Rondônia está na região Norte e na Amazônia Legal, com predomínio de floresta amazônica. Há também faixas de transição com o Cerrado.'},
/* Legislação */
{id:'lg1',m:'lg',e:'De acordo com o art. 37, caput, da Constituição Federal, a administração pública obedecerá aos princípios de',a:['legalidade, razoabilidade, moralidade, publicidade e eficiência.','legalidade, impessoalidade, moralidade, publicidade e eficiência.','legalidade, impessoalidade, supremacia do interesse público, publicidade e eficiência.','legitimidade, impessoalidade, moralidade, transparência e eficácia.','legalidade, isonomia, moralidade, publicidade e economicidade.'],g:1,x:'Os cinco princípios expressos do art. 37 formam a sigla LIMPE: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência.'},
{id:'lg2',m:'lg',e:'Segundo o art. 37, II, da Constituição Federal, a investidura em cargo ou emprego público depende de',a:['indicação da autoridade competente, após análise de currículo.','aprovação em prova de títulos, exclusivamente.','aprovação em estágio probatório, em qualquer caso.','aprovação prévia em concurso público de provas ou de provas e títulos, ressalvados os cargos em comissão de livre nomeação e exoneração.','sorteio entre os candidatos que preencherem os requisitos legais.'],g:3,x:'A regra é o concurso público de provas ou de provas e títulos. A exceção são os cargos em comissão declarados em lei de livre nomeação e exoneração.'},
{id:'lg3',m:'lg',e:'De acordo com o art. 5º da Constituição Federal, é CORRETO afirmar que',a:['ninguém será obrigado a fazer ou deixar de fazer alguma coisa senão em virtude de lei.','é livre a manifestação do pensamento, sendo permitido o anonimato.','a prática do racismo constitui crime afiançável e prescritível.','a pena de morte é admitida em tempo de paz, nos casos previstos em lei.','é plena a liberdade de associação, inclusive para fins de caráter paramilitar.'],g:0,x:'É o princípio da legalidade (art. 5º, II). Nas demais: o anonimato é vedado; o racismo é crime inafiançável e imprescritível; a pena de morte só é admitida em caso de guerra declarada; é vedada a associação de caráter paramilitar.'},
{id:'lg4',m:'lg',e:'Compete aos Municípios, nos termos do art. 30 da Constituição Federal:',a:['legislar privativamente sobre direito civil e comercial.','emitir moeda e fiscalizar as operações financeiras.','manter relações com Estados estrangeiros.','declarar guerra e celebrar a paz.','legislar sobre assuntos de interesse local.'],g:4,x:'Art. 30, I: legislar sobre assuntos de interesse local. As outras competências pertencem à União (arts. 21 e 22).'},
{id:'lg5',m:'lg',e:'Segundo a Lei Brasileira de Inclusão da Pessoa com Deficiência (Lei nº 13.146/2015), a avaliação da deficiência, quando necessária, será',a:['exclusivamente médica, feita por laudo de um único profissional.','baseada apenas na classificação da doença (CID).','biopsicossocial, realizada por equipe multiprofissional e interdisciplinar.','feita pelo próprio interessado, por meio de declaração.','dispensada em todos os casos, bastando a apresentação de documento de identidade.'],g:2,x:'O art. 2º, § 1º, determina que a avaliação é biopsicossocial, feita por equipe multiprofissional e interdisciplinar, considerando impedimentos, fatores ambientais, limitações e restrição de participação.'},
{id:'lg6',m:'lg',e:'Entre as diretrizes da Lei de Acesso à Informação (Lei nº 12.527/2011), está',a:['o sigilo como regra e a publicidade como exceção.','a exigência de que o solicitante justifique o motivo do pedido de acesso.','a restrição do acesso às informações aos servidores públicos.','a cobrança obrigatória de taxa para qualquer pedido de informação.','a observância da publicidade como preceito geral e do sigilo como exceção.'],g:4,x:'Art. 3º, I. Além disso, a lei veda exigências sobre os motivos do pedido (art. 10, § 3º), e a busca e o fornecimento da informação são gratuitos, salvo o custo de reprodução (art. 12).'},
{id:'lg7',m:'lg',e:'Pela Lei de Acesso à Informação, não sendo possível conceder o acesso imediato, o órgão ou entidade deve autorizar ou conceder o acesso em prazo não superior a ___ dias, prorrogável por mais ___ dias, mediante justificativa expressa.',a:['10 e 5','15 e 15','20 e 10','30 e 30','30 e 10'],g:2,x:'Art. 11, §§ 1º e 2º, da Lei nº 12.527/2011: até 20 dias, prorrogáveis por mais 10 dias, com justificativa expressa ao requerente.'},
{id:'lg8',m:'lg',e:'De acordo com a Lei nº 14.133/2021, são modalidades de licitação:',a:['pregão, concorrência, concurso, leilão e diálogo competitivo.','pregão, concorrência, tomada de preços, convite e leilão.','concorrência, tomada de preços, convite, concurso e leilão.','pregão, convite, concurso, leilão e diálogo competitivo.','pregão, concorrência, dispensa, inexigibilidade e leilão.'],g:0,x:'Art. 28. A nova lei extinguiu a tomada de preços e o convite. Dispensa e inexigibilidade são hipóteses de contratação direta, não modalidades de licitação.'},
{id:'lg9',m:'lg',e:'Na Lei nº 14.133/2021, o pregão é a modalidade de licitação obrigatória para a contratação de',a:['obras e serviços de engenharia de grande complexidade.','serviços técnicos especializados de natureza predominantemente intelectual.','alienação de bens imóveis da Administração.','trabalhos técnicos, científicos ou artísticos, com prêmio aos vencedores.','bens e serviços comuns.'],g:4,x:'O pregão é obrigatório para bens e serviços comuns, definidos objetivamente por padrões de desempenho e qualidade usuais de mercado. A alternativa que fala de prêmio descreve o concurso, e a de imóveis descreve o leilão.'},
{id:'lg10',m:'lg',e:'Conforme o art. 37, § 6º, da Constituição Federal, as pessoas jurídicas de direito público respondem pelos danos que seus agentes, nessa qualidade, causarem a terceiros, assegurado',a:['o direito de regresso contra o responsável apenas nos casos de dolo.','o direito de regresso contra o responsável, independentemente de dolo ou culpa.','a isenção de responsabilidade quando o dano decorrer de ato de servidor.','o direito de regresso contra o responsável nos casos de dolo ou culpa.','a transferência integral da responsabilidade ao servidor, que responde sozinho perante o terceiro.'],g:3,x:'A responsabilidade do Estado é objetiva perante o terceiro lesado. Contra o agente, o regresso só cabe nos casos de dolo ou culpa.'},
/* Conhecimentos Específicos: Agente de Secretaria Escolar */
{id:'ce1',m:'ce',e:'Na teoria das três idades dos documentos, o arquivo que reúne documentos de uso eventual, que aguardam o cumprimento de prazos de guarda ou a destinação final, é o arquivo',a:['corrente.','permanente.','intermediário.','provisório.','digital.'],g:2,x:'As três idades são: corrente (uso frequente), intermediário (uso eventual, aguardando prazo ou destinação) e permanente (valor histórico, guarda definitiva).'},
{id:'ce2',m:'ce',e:'O instrumento que define os prazos de guarda e a destinação (eliminação ou guarda permanente) dos documentos de um arquivo é a',a:['tabela de temporalidade.','guia de transferência.','ata de reunião.','tabela de classificação de materiais.','lista de remessa.'],g:0,x:'A tabela de temporalidade estabelece por quanto tempo cada tipo de documento deve ser guardado e qual será o seu destino final.'},
{id:'ce3',m:'ce',e:'Entre as medidas de conservação preventiva de documentos em papel, é adequado',a:['guardá-los em locais úmidos para evitar o ressecamento.','usar fita adesiva para reparar rasgos.','prender as folhas com clipes de metal por longos períodos.','deixá-los expostos à luz solar direta para evitar mofo.','manter o ambiente limpo, ventilado, com temperatura e umidade controladas e protegido da luz direta.'],g:4,x:'Umidade, luz solar, fitas adesivas e metais que enferrujam danificam o papel. A conservação preventiva exige ambiente limpo, arejado, com temperatura e umidade controladas.'},
{id:'ce4',m:'ce',e:'Na teoria do desenvolvimento cognitivo de Jean Piaget, o estágio em que a criança passa a raciocinar logicamente sobre objetos e situações concretas, em geral dos 7 aos 11 anos, é o',a:['sensório-motor.','operatório concreto.','pré-operatório.','operatório formal.','simbólico.'],g:1,x:'Os estágios de Piaget são: sensório-motor, pré-operatório, operatório concreto (cerca de 7 a 11 anos) e operatório formal (a partir dos 11 a 12 anos).'},
{id:'ce5',m:'ce',e:'Em um almoxarifado escolar, o documento usado para registrar as entradas, as saídas e o saldo de cada item de material é a',a:['ata de resultados finais.','folha de frequência.','ficha de matrícula.','ficha de controle de estoque.','declaração de transferência.'],g:3,x:'A ficha de controle de estoque (ou controle informatizado equivalente) registra entradas, saídas e saldo de cada item.'},
{id:'ce6',m:'ce',e:'No controle de estoques, o método PEPS (primeiro que entra, primeiro que sai) é especialmente indicado para',a:['bens permanentes, como carteiras e computadores.','materiais que nunca perdem a validade, como móveis.','materiais perecíveis ou com prazo de validade, como os gêneros alimentícios da merenda escolar.','documentos de guarda permanente.','equipamentos de informática em uso.'],g:2,x:'No PEPS, sai primeiro o que entrou primeiro. Isso reduz perdas por vencimento, por isso é adequado a itens com validade, como alimentos.'},
{id:'ce7',m:'ce',e:'O inventário físico dos bens patrimoniais de uma escola consiste em',a:['conferir periodicamente os bens existentes com os registros patrimoniais, identificando faltas, sobras e bens inservíveis.','comprar novos bens para repor todo o mobiliário a cada ano.','registrar apenas os materiais de consumo recebidos no mês.','avaliar o desempenho pedagógico dos professores.','eliminar documentos cujo prazo de guarda terminou.'],g:0,x:'O inventário compara o que existe fisicamente com o que está registrado, apontando divergências e bens que não servem mais.'},
{id:'ce8',m:'ce',e:'Entre as práticas de gestão ambiental e de sustentabilidade na escola, é adequada',a:['queimar o lixo no pátio para reduzir o volume de resíduos.','descartar pilhas e lâmpadas no lixo comum.','manter torneiras e luzes ligadas para evitar o desgaste dos equipamentos.','usar somente material descartável em todas as atividades.','implantar a coleta seletiva e o uso consciente de água, energia e papel.'],g:4,x:'Coleta seletiva e uso consciente de recursos reduzem o impacto ambiental. Queimar lixo e descartar pilhas e lâmpadas no lixo comum são práticas inadequadas.'},
{id:'ce9',m:'ce',e:'De acordo com o art. 205 da Constituição Federal, a educação, direito de todos e dever do Estado e da família, visa',a:['ao preparo exclusivo para o ingresso no ensino superior.','ao pleno desenvolvimento da pessoa, ao seu preparo para o exercício da cidadania e à sua qualificação para o trabalho.','ao controle do acesso das famílias à escola.','ao desenvolvimento apenas das habilidades de leitura e cálculo.','ao cumprimento de metas administrativas das redes de ensino.'],g:1,x:'Art. 205: a educação será promovida com a colaboração da sociedade, visando ao pleno desenvolvimento da pessoa, ao preparo para a cidadania e à qualificação para o trabalho.'},
{id:'ce10',m:'ce',e:'Entre os princípios com base nos quais o ensino será ministrado, segundo a LDB (Lei nº 9.394/1996, art. 3º), NÃO se inclui',a:['igualdade de condições para o acesso e a permanência na escola.','gratuidade do ensino público em estabelecimentos oficiais.','gestão democrática do ensino público.','cobrança de mensalidade nos estabelecimentos públicos de ensino.','pluralismo de ideias e de concepções pedagógicas.'],g:3,x:'O ensino público é gratuito em estabelecimentos oficiais (art. 3º, VI). Cobrar mensalidade contraria esse princípio.'},
{id:'ce11',m:'ce',e:'Segundo o Estatuto da Criança e do Adolescente (Lei nº 8.069/1990, art. 56), os dirigentes de estabelecimentos de ensino fundamental devem comunicar ao Conselho Tutelar os casos de',a:['apenas indisciplina em sala de aula.','mudança de turno solicitada pelas famílias.','maus-tratos envolvendo alunos, reiteração de faltas injustificadas e evasão escolar (esgotados os recursos da escola) e elevados níveis de repetência.','notas abaixo da média em uma única avaliação.','atrasos eventuais na entrega de documentos.'],g:2,x:'O art. 56 lista: maus-tratos envolvendo alunos; reiteração de faltas injustificadas e evasão escolar, esgotados os recursos escolares; e elevados níveis de repetência.'},
{id:'ce12',m:'ce',e:'O Projeto Político-Pedagógico (PPP) da escola é',a:['o documento que expressa a identidade, os objetivos e as diretrizes da escola, construído de forma coletiva com a comunidade escolar.','um regulamento de condutas, elaborado só pela direção para punir alunos.','o calendário de provas e de reuniões do ano letivo.','o plano de cargos e salários dos profissionais da escola.','um documento elaborado pela secretaria de educação e imposto às escolas sem participação da comunidade.'],g:0,x:'O PPP é o documento que dá identidade à escola. Deve ser construído com a participação da comunidade escolar, em linha com a gestão democrática.'},
{id:'ce13',m:'ce',e:'Entre as atribuições do secretário escolar, destaca-se',a:['planejar as aulas e elaborar as avaliações dos professores.','definir a aprovação ou a reprovação dos alunos.','nomear e exonerar professores.','aplicar sanções disciplinares aos estudantes.','organizar e manter atualizados os registros da vida escolar (matrículas, históricos, transferências), garantindo sua regularidade e autenticidade.'],g:4,x:'O secretário escolar cuida da escrituração e do arquivo da escola. Planejamento de aulas, decisões sobre aprovação e sanções cabem a outros profissionais e instâncias.'},
{id:'ce14',m:'ce',e:'Um responsável chega exaltado à secretaria e reclama de um procedimento da escola. A atitude mais adequada do agente é',a:['responder no mesmo tom, para impor respeito.','manter a calma, ouvir com atenção, esclarecer com cordialidade e, se necessário, encaminhar o caso à direção.','ignorar a reclamação até que a pessoa vá embora.','pedir que volte outro dia, sem nenhuma orientação.','mostrar dados de outros alunos para provar que o procedimento é igual para todos.'],g:1,x:'O bom atendimento combina escuta, cortesia e clareza, com encaminhamento quando necessário. Expor dados de outros alunos viola o sigilo e a proteção de dados pessoais.'},
{id:'ce15',m:'ce',e:'O principal benefício de um sistema informatizado de gestão escolar é',a:['dispensar a conferência dos documentos apresentados na matrícula.','substituir o registro pedagógico feito pelos professores.','permitir que qualquer pessoa consulte os dados pessoais dos alunos.','centralizar e padronizar os registros (matrícula, frequência, notas), reduzindo erros e facilitando consultas, com proteção dos dados pessoais.','eliminar a necessidade de arquivar a documentação dos alunos.'],g:3,x:'O sistema organiza e padroniza as informações, o que reduz erros e agiliza consultas. A conferência de documentos e a proteção de dados continuam necessárias.'}
];

const AULA = {pt:[
/* 0 */ `<p><b>Interpretar</b> é extrair do texto o que ele diz (compreensão) e o que ele deixa entender (inferência), sem acrescentar ideias suas.</p>
<ul><li><b>Tema</b> é o assunto geral. <b>Ideia central</b> é o que o autor defende sobre esse tema.</li>
<li><b>Inferência</b> é a conclusão que o texto autoriza (“infere-se”, “depreende-se”). <b>Extrapolação</b> é ir além do que o texto sustenta, e é o erro mais comum.</li>
<li><b>Denotação</b> é o sentido literal, de dicionário: “A água estava fria”. <b>Conotação</b> é o sentido figurado, que depende do contexto: “Recebeu uma resposta fria”.</li></ul>
<p><b>Tipos textuais</b> (a estrutura): narração (fatos no tempo), descrição (características), dissertação (defende uma ideia com argumentos), exposição (explica um assunto) e injunção (instrui ou ordena, como numa receita). <b>Gêneros</b> (a forma social): notícia, crônica, artigo de opinião, carta, ofício, bula, charge. Um mesmo gênero pode misturar tipos.</p>
<p><b>Armadilhas comuns:</b> alternativas com “sempre”, “nunca”, “todos”, “somente”; alternativas que invertem causa e consequência; comandos com “NÃO” ou “EXCETO”, que pedem a alternativa errada. Leia o comando antes do texto e volte ao texto para confirmar cada alternativa.</p>`,
/* 1 */ `<p><b>Relações entre palavras:</b> sinônimos (sentido parecido), antônimos (sentido oposto), homônimos (mesma pronúncia ou grafia, sentido diferente: “manga” da fruta e da camisa), homófonos (mesmo som, grafia diferente: cela/sela), polissemia (uma palavra com vários sentidos).</p>
<p><b>Parônimos</b> (parecidos, mas diferentes), muito cobrados:</p>
<ul><li>cumprimento (ato de cumprir, saudação) × comprimento (medida)</li><li>descrição (ato de descrever) × discrição (qualidade de quem é discreto)</li>
<li>ratificar (confirmar) × retificar (corrigir)</li><li>infringir (violar) × infligir (aplicar pena)</li>
<li>eminente (ilustre) × iminente (prestes a acontecer)</li><li>emergir (vir à tona) × imergir (mergulhar)</li>
<li>tráfego (trânsito) × tráfico (comércio ilegal)</li><li>absolver (inocentar) × absorver (sugar)</li></ul>
<p><b>Figuras de palavras:</b> comparação (com “como”: “forte como um touro”); metáfora (identificação sem conectivo: “Ele é um touro”); metonímia (troca por proximidade: autor pela obra, “li Machado”; parte pelo todo; continente pelo conteúdo, “bebi dois copos”); sinestesia (mistura de sentidos: “voz doce”); personificação (atribui ação humana a seres não humanos: “o vento sussurrava”).</p>
<p><b>Figuras de pensamento:</b> hipérbole (exagero: “disse mil vezes”); eufemismo (suaviza: “partiu desta para melhor”); ironia (diz o contrário do que pensa); antítese (ideias opostas: “alegria e tristeza”); paradoxo (contradição aparente: “o silêncio gritava”); gradação (sequência crescente ou decrescente); apóstrofe (chamamento a alguém ou algo).</p>`,
/* 2 */ `<p><b>Coesão</b> é a ligação entre as partes do texto, feita por palavras. <b>Coerência</b> é a lógica de sentido: um texto pode ter conectivos e ainda assim ser incoerente, se contradiz a si mesmo.</p>
<p><b>Coesão referencial:</b> retoma termos já ditos por pronomes (“Os candidatos chegaram. <i>Eles</i> aguardaram”), sinônimos, elipse (omissão de termo subentendido). A retomada de algo já dito é chamada de anáfora; a antecipação de algo que virá, catáfora.</p>
<p><b>Coesão sequencial:</b> conectivos, com valores que precisam estar na ponta da língua:</p>
<ul><li><b>Adição:</b> e, nem, também. <b>Oposição:</b> mas, porém, contudo, todavia, entretanto, no entanto.</li>
<li><b>Alternância:</b> ou, ora… ora. <b>Conclusão:</b> logo, portanto, por conseguinte, pois (depois do verbo). <b>Explicação:</b> pois (antes do verbo), porque, que.</li>
<li><b>Causa:</b> porque, já que, visto que, uma vez que. <b>Concessão</b> (admite algo e contrapõe): embora, ainda que, conquanto, mesmo que, apesar de que.</li>
<li><b>Condição:</b> se, caso, desde que, contanto que. <b>Finalidade:</b> para que, a fim de que. <b>Consequência:</b> tão… que, de modo que.</li>
<li><b>Tempo:</b> quando, assim que, logo que, enquanto. <b>Conformidade:</b> conforme, segundo, consoante. <b>Proporção:</b> à medida que, quanto mais… mais. <b>Comparação:</b> como, tal qual, mais que.</li></ul>
<p>Cuidado: “mas” (oposição) não é igual a “embora” (concessão). Em “Embora estivesse cansado, continuou”, a oração com “embora” traz o obstáculo que não impediu o fato.</p>`,
/* 3 */ `<p><b>Estrutura:</b> radical (a parte que carrega o sentido), afixos (prefixos antes, sufixos depois), vogal temática (liga o radical às desinências), desinências (nominais: gênero e número; verbais: modo-tempo e número-pessoa) e vogais ou consoantes de ligação (cafeteira, gasômetro).</p>
<p><b>Processos de formação:</b></p>
<ul><li><b>Derivação prefixal:</b> acrescenta prefixo (<i>des</i>leal, <i>in</i>feliz). <b>Sufixal:</b> acrescenta sufixo (feliz<i>mente</i>, pedr<i>eiro</i>).</li>
<li><b>Derivação parassintética:</b> prefixo e sufixo entram ao mesmo tempo, e a palavra não existe sem os dois: <i>en</i>tard<i>ecer</i>, <i>a</i>noit<i>ecer</i>, <i>em</i>barc<i>ar</i>.</li>
<li><b>Derivação regressiva:</b> reduz um verbo e forma um substantivo (pescar → a pesca; atacar → o ataque; comprar → a compra).</li>
<li><b>Derivação imprópria:</b> muda a classe sem mudar a forma (“o jantar”, “um não”, “o porquê”).</li>
<li><b>Composição por justaposição:</b> as palavras mantêm sua forma (guarda-chuva, girassol, passatempo). <b>Por aglutinação:</b> uma delas perde elementos (planalto = plano + alto; aguardente = água + ardente).</li>
<li><b>Outros:</b> hibridismo (junta elementos de línguas diferentes: automóvel, sociologia), abreviação (foto, pneu), siglas (INSS), onomatopeia (tique-taque), neologismo (palavra nova).</li></ul>
<p>Dica: para saber se é parassíntese, tente tirar só o prefixo ou só o sufixo. Se o que sobra não existe (“entardece” sem “en” ou “tardecer” não existem), é parassíntese.</p>`,
/* 4 */ `<p><b>Substantivo:</b> comum ou próprio; concreto ou abstrato; simples ou composto; primitivo ou derivado. <b>Coletivos</b> clássicos: alcateia (lobos), cardume (peixes), enxame (abelhas), manada (bois), plateia (espectadores), elenco (atores), acervo (obras), corpo docente (professores).</p>
<p><b>Gênero:</b> uniformes (um só gênero), como os <i>epicenos</i> (a cobra macho e a cobra fêmea) e os <i>sobrecomuns</i> (a criança, a testemunha, o cônjuge, para qualquer sexo); <i>comuns de dois gêneros</i> mudam só o artigo (o/a colega, o/a jornalista). Gênero vacilante: o dó, o telefonema, a alface, a cal, a dinamite.</p>
<p><b>Plural:</b> palavras em -ão fazem -ões (ações), -ães (cães, capitães, escrivães) ou -ãos (cidadãos, cristãos, irmãos, mãos, órfãos, órgãos, grãos). Em -al, -el, -ol, -ul: -ais, -éis, -óis, -uis (animal → animais; papel → papéis). Em -il: oxítonas viram -is (fuzil → fuzis), paroxítonas viram -eis (fácil → fáceis). Em -s: palavras de mais de uma sílaba que não são oxítonas não variam (o lápis, os lápis); oxítonas e monossílabos fazem -es (mês → meses; freguês → fregueses). Em -r e -z: -es (mulher → mulheres; luz → luzes).</p>
<p><b>Plural de compostos:</b> verbo + substantivo, só o segundo varia (guarda-chuvas, beija-flores). Substantivo + substantivo, em geral ambos (couves-flores). Adjetivo + substantivo, ambos (amores-perfeitos). Palavra invariável + substantivo, só o segundo (abaixo-assinados).</p>
<p><b>Adjetivo:</b> concorda com o substantivo. Adjetivos compostos variam só no último elemento (surdos-mudos; camisas verde-claras). Os de cor formados por substantivo ficam invariáveis (camisas rosa, olhos cinza, blusas azul-marinho). <b>Locução adjetiva</b> × adjetivo: de rim = renal, de olho = ocular, de chuva = pluvial, de pai = paterno, de cidade = urbano. <b>Pátrios:</b> Porto Velho, porto-velhense; Rondônia, rondoniense; Amazonas, amazonense; Acre, acriano.</p>
<p><b>Numeral:</b> cardinal (dois), ordinal (segundo), multiplicativo (dobro, triplo), fracionário (meio, terço). <b>Artigo:</b> definido (o, a, os, as) particulariza; indefinido (um, uma, uns, umas) generaliza.</p>`,
/* 5 */ `<p><b>Pessoais:</b> retos (eu, tu, ele, nós, vós, eles) fazem papel de sujeito; oblíquos átonos (me, te, se, o, a, lhe, nos, vos, os, as, lhes) fazem o papel de complemento; oblíquos tônicos (mim, ti, si, comigo, contigo, consigo, conosco, convosco) vêm com preposição.</p>
<p>Regra clássica: depois de preposição vem pronome oblíquo tônico (“entre mim e ti”, “para mim”), <i>exceto</i> quando o pronome é sujeito de um verbo no infinitivo: “Trouxe o livro para <b>eu</b> ler”. “Entre eu e você” é erro.</p>
<p><b>Tratamento:</b> Vossa Excelência (autoridades), Vossa Senhoria (cartas comerciais e oficiais para pessoas em geral), Vossa Santidade (papa), Vossa Magnificência (reitores). Quando se fala <b>com</b> a pessoa, usa-se “Vossa”; quando se fala <b>dela</b>, usa-se “Sua”. O verbo vai para a 3ª pessoa.</p>
<p><b>Demonstrativos:</b> este (perto de quem fala), esse (perto de quem ouve), aquele (longe de ambos). No texto: “este” anuncia o que vem a seguir; “esse” retoma o que já foi dito.</p>
<p><b>Relativos:</b> que, quem, o qual, cujo, onde, quanto. <b>Cujo</b> indica posse, concorda com o que vem depois e não admite artigo logo em seguida: “O candidato <i>cujo</i> nome consta da lista”. <b>Onde</b> só para lugar: “A escola <i>onde</i> estudei”. Com preposição exigida pelo verbo, ela vem antes do relativo: “O cargo <i>a que</i> aspiro”, “O livro <i>de que</i> gosto”, “A pessoa <i>com quem</i> falei”.</p>
<p><b>Indefinidos</b> (algum, nenhum, tudo, ninguém, cada, certo, outrem) e <b>interrogativos</b> (que, quem, qual, quanto). “Cada” é invariável e acompanha substantivo (“cada aluno”).</p>`,
/* 6 */ `<p><b>Advérbio</b> é invariável e modifica verbo, adjetivo ou outro advérbio: lugar (aqui), tempo (hoje), modo (bem, mal), intensidade (muito, bastante, meio), afirmação, negação, dúvida. “Meio cansada” e “bastante cansada” são advérbios (invariáveis); em “bastantes razões”, “bastante” é adjetivo e varia.</p>
<p>Confusões: <b>mal</b> (oposto de bem; “passei mal”) × <b>mau</b> (oposto de bom; “um mau aluno”); <b>a fim de</b> (finalidade) × <b>afim</b> (semelhante); <b>há</b> (tempo passado) × <b>a</b> (tempo futuro ou distância): “Há dois anos viajei”, “Daqui a dois anos viajo”.</p>
<p><b>Preposições essenciais:</b> a, ante, após, até, com, contra, de, desde, em, entre, para, perante, por, sem, sob, sobre, trás. Elas se juntam a artigos e pronomes: ao (a + o), do, no, pelo, àquele.</p>
<p><b>A palavra “que”:</b></p>
<ul><li><b>Pronome relativo:</b> pode ser trocado por “o qual” (“O livro <i>que</i> li”).</li><li><b>Conjunção integrante:</b> introduz oração que completa o verbo (“Disse <i>que</i> viria”).</li>
<li><b>Conjunção</b> causal ou explicativa (“Venha, <i>que</i> é tarde”), consecutiva, comparativa.</li><li><b>Advérbio de intensidade:</b> “<i>Que</i> bonito!” (= quão).</li></ul>
<p><b>A palavra “se”:</b></p>
<ul><li><b>Partícula apassivadora:</b> verbo transitivo direto + se, concorda com o sujeito paciente (“Vendem-se casas”).</li>
<li><b>Índice de indeterminação do sujeito:</b> verbo sem objeto direto + se, no singular (“Precisa-se de funcionários”; “Vive-se bem aqui”).</li>
<li><b>Reflexivo ou recíproco:</b> “Ele se feriu”; “Eles se abraçaram”. <b>Parte do verbo:</b> queixar-se, arrepender-se.</li>
<li><b>Conjunção:</b> condicional (“Se chover…”) ou integrante (“Não sei se ele vem”).</li></ul>`,
/* 7 */ `<p><b>Modos:</b> indicativo (fato, certeza), subjuntivo (dúvida, hipótese, desejo), imperativo (ordem, pedido). <b>Formas nominais:</b> infinitivo (estudar), gerúndio (estudando), particípio (estudado).</p>
<p><b>Tempos do indicativo:</b> presente, pretérito perfeito (estudei), imperfeito (estudava), mais-que-perfeito (estudara), futuro do presente (estudarei), futuro do pretérito (estudaria). <b>Subjuntivo:</b> presente (que eu estude), pretérito imperfeito (se eu estudasse), futuro (quando eu estudar).</p>
<p><b>Correlação:</b> “Se eu <i>tivesse</i> tempo, <i>estudaria</i> mais” (imperfeito do subjuntivo com futuro do pretérito). “Se eu <i>tiver</i> tempo, <i>estudarei</i>” (futuro do subjuntivo com futuro do presente).</p>
<p><b>Verbos que mais caem:</b></p>
<ul><li><b>Ver:</b> vejo, viu; futuro do subjuntivo: “quando eu <b>vir</b>, quando ele vir”. <b>Vir:</b> venho, vem (plural vêm); futuro do subjuntivo: “quando ele <b>vier</b>”.</li>
<li><b>Ter</b> e <b>vir</b>: singular sem acento (tem, vem), plural com circunflexo (têm, vêm). Derivados: mantém/mantêm, intervém/intervêm, contém/contêm.</li>
<li><b>Intervir</b> segue vir: “se ele <b>intervier</b>”. <b>Manter</b> segue ter: “se ele mantiver”.</li>
<li><b>Fazer:</b> fiz, fez; “se eu fizer”. <b>Dizer:</b> disse; “se eu disser”. <b>Trazer:</b> trouxe; “se eu trouxer”. <b>Querer:</b> quis; “se eu quiser”. <b>Poder:</b> pude, pôde; “se eu puder”. <b>Pôr:</b> pus, pôs; “se eu puser”.</li>
<li><b>Haver:</b> há, houve, “Deve haver soluções” (impessoal, não vai para o plural). <b>Defectivos:</b> verbos sem algumas formas, como <i>abolir</i> (não se usa “eu abulo”) e <i>falir</i>.</li></ul>
<p>Pretérito imperfeito do subjuntivo se forma a partir do pretérito perfeito: “eles <i>puseram</i> → se eu <i>pusesse</i>”; “eles <i>disseram</i> → se eu <i>dissesse</i>”.</p>`,
/* 8 */ `<p><b>Voz ativa:</b> o sujeito pratica a ação (“A diretora assinou o ofício”). <b>Voz passiva analítica:</b> o sujeito sofre a ação, com “ser” + particípio (“O ofício foi assinado pela diretora”); “pela diretora” é o agente da passiva. <b>Voz passiva sintética:</b> verbo transitivo direto + “se” (“Assinou-se o ofício”; “Alugam-se salas”). <b>Voz reflexiva:</b> o sujeito pratica e sofre (“Ela se vestiu”).</p>
<p><b>Predicação</b> é a forma como o verbo se relaciona com seus complementos:</p>
<ul><li><b>Verbo de ligação</b> (ser, estar, ficar, permanecer, continuar, parecer, tornar-se, andar) + predicativo do sujeito forma o <b>predicado nominal</b>: “Os alunos ficaram atentos”.</li>
<li><b>Intransitivo:</b> sentido completo, sem complemento (“Ele chegou”).</li>
<li><b>Transitivo direto:</b> complemento sem preposição (“Li o livro”). <b>Transitivo indireto:</b> complemento com preposição (“Obedeço ao regulamento”; “Gosto de estudar”).</li>
<li><b>Transitivo direto e indireto:</b> os dois (“Entreguei o documento ao diretor”).</li>
<li><b>Predicado verbo-nominal:</b> um verbo de ação e um predicativo (“Os alunos chegaram cansados”).</li></ul>
<p>O mesmo verbo muda de predicação conforme o sentido: “Ele <i>ficou</i> triste” (ligação) e “Ele <i>ficou</i> em casa” (intransitivo, com adjunto de lugar).</p>`,
/* 9 */ `<p>Regra geral: o verbo concorda em número e pessoa com o <b>sujeito</b>. Os casos que mais caem:</p>
<ul><li><b>Sujeito composto:</b> verbo no plural. Se o sujeito vem depois do verbo, pode ficar no plural ou concordar com o mais próximo.</li>
<li><b>Pessoas diferentes:</b> a 1ª pessoa prevalece (“Eu e ele fomos”); sem 1ª, a 2ª prevalece em teoria, mas usa-se a 3ª no plural (“Tu e ele foram”).</li>
<li><b>Ligados por “ou”:</b> singular se há exclusão (“O diretor ou o secretário assinará”); plural se a ideia é de soma.</li>
<li><b>“Mais de um”:</b> singular (“Mais de um aluno saiu”); plural em reciprocidade (“Mais de um se abraçaram”).</li>
<li><b>“Cerca de”, “perto de”, “mais de” + numeral:</b> concorda com o numeral (“Cerca de dez alunos faltaram”).</li>
<li><b>Um dos que:</b> verbo no plural (“Ele é um dos que mais estudam”).</li>
<li><b>Coletivo:</b> singular (“A multidão gritou”). “A maioria dos alunos”: singular ou plural são aceitos.</li>
<li><b>Porcentagem + substantivo:</b> concorda com o substantivo (“20% dos candidatos faltaram”; “1% da população faltou”).</li>
<li><b>Voz passiva sintética:</b> verbo concorda com o sujeito paciente (“Vendem-se casas”, “Vende-se casa”). Com indeterminação, fica no singular (“Precisa-se de funcionários”).</li>
<li><b>Verbos impessoais:</b> <i>haver</i> (existir ou tempo) e <i>fazer</i> (tempo) não variam: “Há dúvidas”, “Faz dois anos”, “Deve haver soluções”. Fenômenos da natureza também (“Choveu muito”). “Haviam” e “fazem dois anos” são erros.</li>
<li><b>Ser:</b> “São duas horas”, “Hoje é dia 10”. <b>Títulos de obras</b> no plural levam o verbo no singular quando o título é visto como um todo (“Os Sertões é uma obra marcante”).</li></ul>`,
/* 10 */ `<p>O adjetivo, o artigo, o pronome e o numeral concordam em gênero e número com o substantivo.</p>
<ul><li><b>Meio</b> (advérbio) não varia: “Ela estava <i>meio</i> cansada”. Como numeral, varia: “meia hora”. <b>Bastante</b> segue a mesma lógica (“bastante cansadas” × “bastantes razões”).</li>
<li><b>Anexo, incluso, obrigado, mesmo, próprio</b> variam: “Seguem <i>anexas</i> as certidões”; “Muito <i>obrigada</i>”, diz uma mulher; “Elas <i>mesmas</i> resolveram”. “<i>Em anexo</i>” é invariável.</li>
<li><b>Só</b> (= sozinho) varia: “Elas ficaram <i>sós</i>”. “A sós” é invariável. <b>Menos</b> e <b>alerta</b> (advérbio) não variam.</li>
<li><b>É proibido, é necessário, é bom, é permitido:</b> ficam invariáveis quando o sujeito não tem artigo ou determinante (“É proibido entrada”). Com artigo, concordam: “É proibida a entrada”.</li>
<li><b>Todo</b> (qualquer) × <b>todo o</b> (inteiro): “todo dia” é qualquer dia; “todo o dia” é o dia inteiro.</li>
<li>Um adjetivo que qualifica vários substantivos vai ao plural, ou concorda com o mais próximo se vier antes deles.</li></ul>`,
/* 11 */ `<p><b>Regência verbal</b> é a relação entre o verbo e o seu complemento. Os verbos mais cobrados:</p>
<ul><li><b>Aspirar a</b> (desejar): “aspirar ao cargo”. Aspirar (sentido de respirar): transitivo direto.</li>
<li><b>Assistir a</b> (ver): “assistir ao jogo”. Assistir (ajudar) é direto.</li>
<li><b>Obedecer</b> e <b>desobedecer a</b>; <b>responder a</b>; <b>visar a</b> (ter por objetivo); <b>preferir X a Y</b> (“prefiro estudar a dormir”, nunca “mais do que”).</li>
<li><b>Esquecer e lembrar:</b> sem pronome, são diretos (“Esqueci o endereço”); com pronome, pedem “de” (“Esqueci-me do endereço”).</li>
<li><b>Informar, avisar, comunicar:</b> “informar alguém de/sobre algo” ou “informar algo a alguém”.</li>
<li><b>Chegar e ir</b> pedem “a” (“Cheguei a Porto Velho”); <b>morar e residir</b> pedem “em”.</li>
<li><b>Agradecer:</b> “agradecer algo a alguém”. <b>Perdoar:</b> “perdoar algo a alguém”. <b>Custar</b> (ser difícil): “custa-me acreditar”.</li></ul>
<p><b>Regência nominal:</b> nomes também exigem preposição: acesso a, amor a/por, ansioso por, apto a/para, capaz de/para, confiança em, contrário a, dúvida sobre, necessidade de, obediência a, residente em, respeito a/por, aversão a/por.</p>
<p>Com pronome relativo, a preposição do verbo vem antes dele: “o cargo <b>a que</b> aspiro”, “o filme <b>a que</b> assisti”, “a pessoa <b>de quem</b> falei”.</p>`,
/* 12 */ `<p><b>Crase</b> é a fusão da preposição <b>a</b> com o artigo <b>a(s)</b> ou com o <b>a</b> inicial de aquele, aquela, aquilo. Para haver crase, é preciso que o verbo ou nome peça “a” e que a palavra seguinte aceite artigo feminino.</p>
<p><b>Teste prático:</b> troque a palavra feminina por uma masculina. Se aparecer “ao”, há crase: “Fui à escola” ← “Fui ao colégio”. Outro teste: “voltar da” → crase; “voltar de” → sem crase. “Volto <i>da</i> Bahia” → “Vou <i>à</i> Bahia”; “Volto <i>de</i> Porto Velho” → “Vou <i>a</i> Porto Velho”.</p>
<p><b>Há crase:</b> às horas determinadas (“às 14 horas”, “à meia-noite”); locuções femininas (à noite, à tarde, às vezes, à vontade, à direita, à esquerda, à toa, à medida que, à procura de, à frente de, à beira de); diante de aquele, aquela, aquilo (“Refiro-me àquele caso”); antes de “a qual”, “as quais” (“a reunião à qual compareci”).</p>
<p><b>Não há crase:</b> antes de palavra masculina (“a pé”, “a cavalo”); de verbo (“começou a falar”); de pronome pessoal, de tratamento, indefinido e demonstrativo, exceto aquele/aquela/aquilo (“a ele”, “a você”, “a alguém”, “a esta”); entre palavras repetidas (“frente a frente”, “dia a dia”); antes de palavra no plural sem artigo (“a pessoas”); antes de nome de cidade sem artigo (“a Brasília”, “a Roma”, mas “à Brasília dos anos 60”); depois de outra preposição (“para a escola”, “com a diretora”).</p>
<p><b>Facultativo:</b> antes de pronome possessivo feminino (“à/a minha casa”), de nomes próprios femininos de pessoas (“entreguei à/a Maria”), e depois de “até” (“até à/a escola”).</p>`,
/* 13 */ `<p><b>Próclise</b> (pronome antes do verbo) é obrigatória quando há palavra atrativa:</p>
<ul><li>negação: “Não <i>me</i> avisaram”; “Nunca <i>se</i> esqueceu”.</li><li>pronomes relativos, interrogativos e indefinidos: “O livro que <i>me</i> deram”; “Quem <i>lhe</i> disse isso?”; “Tudo <i>me</i> contaram”.</li>
<li>conjunções subordinativas: “Disse que <i>me</i> entregaria”.</li><li>advérbio sem vírgula: “Ontem <i>me</i> avisaram”.</li><li>orações optativas: “Deus <i>o</i> abençoe”. “Em” + gerúndio: “em se tratando de”.</li></ul>
<p><b>Ênclise</b> (depois do verbo, com hífen): verbo no início da oração (“Entregou-<i>me</i> o ofício”); imperativo afirmativo (“Entregue-<i>me</i> o ofício”); gerúndio sem “em” (“Avisando-<i>o</i>, saí”).</p>
<p><b>Mesóclise</b> (no meio do verbo): futuro do presente ou do pretérito, sem palavra atrativa: “Entregar-<i>lhe</i>-ei o ofício”; “Entregá-<i>lo</i>-ia”. Com palavra atrativa, volta a próclise: “Não <i>lhe</i> entregarei”.</p>
<p><b>Particularidades:</b> não se começa frase com pronome átono na norma-padrão (“Me entregue…” é coloquial). Com particípio, o pronome nunca vem preso a ele (“Tinha-me avisado”, jamais “Tinha avisado-me”). Depois de verbos terminados em r, s, z, o pronome “o” vira “lo” (“Vou entregá-lo”); depois de som nasal, vira “no” (“Entregaram-no”).</p>`,
/* 14 */ `<p><b>Termos essenciais:</b></p>
<ul><li><b>Sujeito:</b> simples, composto, oculto (desinencial), indeterminado (“Precisa-se de professores”; “Batem à porta”) ou <b>oração sem sujeito</b>: haver (existir ou tempo), fazer (tempo) e fenômenos da natureza (“Choveu”, “Há problemas”, “Faz dois anos”).</li>
<li><b>Predicado:</b> verbal, nominal ou verbo-nominal.</li></ul>
<p><b>Termos integrantes:</b> objeto direto (sem preposição), objeto indireto (com preposição), complemento nominal (completa o sentido de substantivo, adjetivo ou advérbio: “necessidade <i>de estudo</i>”, “fiel <i>à causa</i>”), agente da passiva.</p>
<p><b>Termos acessórios:</b></p>
<ul><li><b>Adjunto adnominal:</b> qualifica ou determina um substantivo (“casa <i>grande</i>”, “livro <i>de Maria</i>”).</li>
<li><b>Adjunto adverbial:</b> circunstância de tempo, lugar, modo, causa (“Chegou <i>cedo</i>”, “Estudo <i>à noite</i>”).</li>
<li><b>Aposto:</b> explica ou resume um termo (“Porto Velho, <i>capital de Rondônia</i>, cresce”).</li>
<li><b>Vocativo:</b> chama o interlocutor, isolado por vírgula (“<i>Maria</i>, entregue o ofício”).</li></ul>
<p><b>Complemento nominal × adjunto adnominal:</b> o complemento nominal recebe a ação (é “paciente”): “a destruição <i>da cidade</i>” (a cidade é destruída). O adjunto adnominal com “de” costuma indicar agente ou posse: “a invasão <i>dos bárbaros</i>”, “a casa <i>de João</i>”.</p>`,
/* 15 */ `<p><b>Período composto</b> tem duas ou mais orações.</p>
<p><b>Coordenação</b> (orações independentes): assindética (sem conjunção, separada por vírgula) ou sindética: aditiva (e, nem), adversativa (mas, porém, contudo), alternativa (ou, ora… ora), conclusiva (logo, portanto) e explicativa (pois, porque).</p>
<p><b>Subordinação</b> (uma oração depende da outra):</p>
<ul><li><b>Substantivas</b> (funcionam como substantivo; teste: troque por “isso”): subjetiva (“É importante <i>que estudemos</i>”), objetiva direta (“Quero <i>que estudem</i>”), objetiva indireta, completiva nominal, predicativa, apositiva.</li>
<li><b>Adjetivas</b> (funcionam como adjetivo, introduzidas por pronome relativo): <i>restritiva</i>, sem vírgula, delimita o termo (“Os alunos <b>que estudaram</b> passaram”: só os que estudaram); <i>explicativa</i>, entre vírgulas, só acrescenta informação (“Os alunos, <b>que estudaram</b>, passaram”: todos estudaram e passaram).</li>
<li><b>Adverbiais:</b> causal, concessiva (embora), condicional (se), comparativa, consecutiva (tão… que), conformativa (conforme), final (para que), proporcional (à medida que), temporal (quando).</li></ul>
<p><b>Orações reduzidas</b> não têm conectivo e têm verbo em forma nominal: “Ao chegar, avisei” (= Quando cheguei, avisei).</p>`,
/* 16 */ `<p><b>Vírgula, use para:</b> separar itens de enumeração; isolar aposto, vocativo e oração adjetiva explicativa; separar adjunto adverbial deslocado ou extenso (“Ontem, na reunião, o diretor falou”); isolar expressões explicativas (“isto é”, “ou seja”) e conectivos intercalados (“Ele, porém, voltou”); indicar omissão de verbo (“Eu gosto de café; ela, de chá”); separar local e data (“Porto Velho, 31 de outubro de 2026”).</p>
<p><b>Não use vírgula entre:</b> sujeito e verbo (“Os alunos, chegaram” ✗); verbo e complemento (“Disse, que viria” ✗); nome e seu complemento; oração principal e subordinada substantiva (“Quero que estude”); antes de “e” que liga termos de mesmo sentido (“Estudou e passou”). A vírgula vem <b>antes</b> de “mas”, “porém”, “contudo”.</p>
<p><b>Ponto e vírgula:</b> separa itens de uma lista longa ou com vírgulas internas, e orações coordenadas extensas. <b>Dois-pontos:</b> introduzem enumeração, explicação ou citação. <b>Travessão:</b> isola explicação ou marca diálogo. <b>Aspas:</b> citações, estrangeirismos, ironia. <b>Reticências:</b> suspensão ou interrupção.</p>
<p>Atenção ao sentido: a presença ou ausência de vírgula muda o significado. “Os candidatos que chegaram atrasados não entraram” indica que só alguns se atrasaram; com vírgulas, todos chegaram atrasados.</p>`,
/* 17 */ `<p>Primeiro identifique a <b>sílaba tônica</b> (a mais forte) e a classifique em oxítona (última), paroxítona (penúltima) ou proparoxítona (antepenúltima).</p>
<ul><li><b>Proparoxítonas:</b> todas levam acento (lâmpada, médico, árvore, pássaro).</li>
<li><b>Oxítonas</b> terminadas em a(s), e(s), o(s), em/ens: sofá, café, avô, também, parabéns. <b>Monossílabos tônicos</b> em a(s), e(s), o(s): já, pé, só, nós, mês.</li>
<li><b>Paroxítonas</b> terminadas em l, n, r, x, ps, i(s), us, um/uns, ão(s), ã(s) e ditongos orais: automóvel, hífen (plural: hifens, sem acento), açúcar, tórax, bíceps, táxi, lápis, vírus, álbum, órgão, órfã, história.</li>
<li><b>Hiatos:</b> i e u tônicos, sozinhos na sílaba ou seguidos de s, levam acento: saída, país, baú, saúde, juízo. Não acentuam se vierem seguidos de outra consoante na mesma sílaba (ruim, juiz), nem depois de ditongo (feiura, baiuca).</li></ul>
<p><b>Acordo Ortográfico (em vigor):</b> perderam o acento os ditongos abertos “éi” e “ói” de paroxítonas (ideia, assembleia, jiboia, heroico); “êe” e “ôo” (leem, veem, voo, enjoo); e o acento diferencial de “para” (verbo), “pelo”, “pela”, “polo”. O trema foi extinto (linguiça, frequente). Continuam: <b>pôr</b> (verbo) × por (preposição); <b>pôde</b> (passado) × pode (presente); têm/vêm (plural) × tem/vem (singular).</p>`,
/* 18 */ `<p><b>Dúvidas frequentes de grafia:</b> exceção, excesso, expectativa (esperança), espectador (quem assiste), privilégio, previdência, beneficente, discussão, extensão, pretensão, ascensão (subida), descendente, obsessão, cabeleireiro, mexerica, ojeriza, enxerto, mochila.</p>
<p><b>Hífen:</b></p>
<ul><li>Com ex-, vice-, sota-, soto-, pós-, pré-, pró- (tônicos): ex-aluno, vice-presidente, pré-escolar, pós-graduação.</li>
<li>Prefixo terminado em vogal + palavra começada pela <b>mesma</b> vogal: hífen (anti-inflamatório, micro-ondas). Vogais <b>diferentes</b>: sem hífen (autoestima, infraestrutura, extraoficial).</li>
<li>Prefixo terminado em vogal + <b>r</b> ou <b>s</b>: dobra a consoante, sem hífen (antirrugas, contrassenso, minissaia).</li>
<li>Com <b>h</b>: hífen (anti-higiênico, super-homem). Com circum- e pan- + vogal, m, n: hífen (circum-navegação, pan-americano).</li>
<li>Palavras com hífen estabelecido: bem-vindo, recém-casado, além-mar, mal-educado.</li></ul>
<p><b>Usos do porquê:</b></p>
<ul><li><b>Por que</b> (pergunta, “por qual razão”, ou “pelo qual”): “Por que você faltou?”; “Não sei por que ele saiu”.</li>
<li><b>Porque</b> (resposta; conjunção causal ou explicativa): “Faltei porque estava doente”.</li>
<li><b>Por quê</b> (fim de frase ou antes de pausa): “Você faltou por quê?”.</li>
<li><b>Porquê</b> (substantivo, vem com artigo): “Não entendi o porquê da demora”.</li></ul>
<p><b>Outras parcerias:</b> mas (oposição) × mais (quantidade); aonde (a onde, com verbo de movimento: “Aonde vamos?”) × onde (lugar: “Onde estamos?”); demais (muito) × de mais (oposto de “de menos”); senão (caso contrário) × se não (condicional); tampouco (também não) × tão pouco; acerca de (sobre) × há cerca de (faz aproximadamente).</p>`,
/* 19 */ `<p><b>Figuras de sintaxe</b> alteram a construção da frase, de forma expressiva:</p>
<ul><li><b>Elipse:</b> omissão de termo facilmente subentendido (“Fui ao mercado e [eu] comprei pão”).</li>
<li><b>Zeugma:</b> omissão de termo já citado (“Eu gosto de café; ela, de chá”: omite “gosta”).</li>
<li><b>Pleonasmo:</b> repetição para reforçar (“Vi com meus próprios olhos”). Quando não acrescenta nada, é vício (“subir para cima”, “entrar para dentro”).</li>
<li><b>Hipérbato ou inversão:</b> ordem alterada (“De um copo d’água beberam os dois”).</li>
<li><b>Anacoluto:</b> quebra da estrutura sintática (“Eu, parece-me que ninguém me ouviu”).</li>
<li><b>Silepse:</b> concordância com a ideia, não com a palavra: de gênero (“Vossa Excelência está cansado”, dito a um homem), de número (“A multidão correram”) e de pessoa (“Os brasileiros somos otimistas”).</li>
<li><b>Polissíndeto:</b> repetição de conjunções (“E chora, e ri, e grita”). <b>Assíndeto:</b> omissão delas (“Cheguei, vi, venci”).</li>
<li><b>Anáfora:</b> repetição no começo de versos ou frases.</li></ul>
<p>Para a prova, memorize pares de contraste: <i>zeugma</i> (omite termo já dito) × <i>elipse</i> (omite termo subentendido); <i>polissíndeto</i> (excesso de “e”) × <i>assíndeto</i> (ausência).</p>`,
/* 20 */ `<p><b>Variação linguística</b> é a diversidade natural no uso da língua. Tipos:</p>
<ul><li><b>Diatópica (regional):</b> “mandioca”, “macaxeira” e “aipim”.</li><li><b>Diastrática (social):</b> grupos, escolaridade, profissão, gírias.</li>
<li><b>Diafásica (situacional ou de registro):</b> formal ou informal, conforme o contexto. <b>Diacrônica (histórica):</b> a língua muda no tempo (“vosmecê” virou “você”).</li></ul>
<p><b>Norma-padrão</b> é o modelo descrito pela gramática normativa. <b>Norma culta</b> é a variedade realmente usada por falantes escolarizados em situações formais. Nenhuma variedade é “errada” em si; há adequação ou inadequação ao contexto. Julgar alguém pela forma de falar é <b>preconceito linguístico</b>.</p>
<p><b>Em documentos oficiais</b> (ofícios, requerimentos, comunicados): registro formal, impessoalidade, clareza, concisão e uniformidade, sem gírias nem regionalismos.</p>
<p><b>Problemas da língua culta:</b></p>
<ul><li><b>Barbarismo:</b> erro de grafia, pronúncia ou forma (“menas”, “pobrema”).</li><li><b>Solecismo:</b> erro de sintaxe (“Haviam muitas pessoas”).</li>
<li><b>Pleonasmo vicioso</b> (“subir para cima”), <b>ambiguidade</b>, <b>cacofonia</b>, <b>gerundismo</b> (“vou estar enviando” em vez de “enviarei”).</li>
<li><b>Ao invés de</b> (ao contrário de: “subiu ao invés de descer”) × <b>em vez de</b> (no lugar de). <b>A nível de</b> deve ser evitado; prefira “em nível de” ou “quanto a”. <b>Através de</b> não é igual a “por meio de” em todos os usos; prefira “por meio de”.</li></ul>`
]};

PTQ(3,0,'No trecho “Misture a farinha com o açúcar, acrescente os ovos e mexa até obter uma massa homogênea”, predomina o tipo textual',['narrativo.','descritivo.','dissertativo.','injuntivo.','argumentativo.'],3,'Os verbos no imperativo orientam o leitor sobre o que fazer. É o tipo injuntivo (instrucional), típico de receitas, manuais e bulas.'),
PTQ(4,0,'Um texto que relata um fato recente, responde a perguntas como “o quê?”, “quem?”, “quando?” e “onde?” e costuma ter título e lide pertence ao gênero',['crônica.','notícia.','carta pessoal.','receita.','poema.'],1,'A notícia informa fatos atuais de forma objetiva; o lide é o primeiro parágrafo, que resume as informações essenciais.'),
PTQ(5,0,'Em qual das frases a palavra “fria” está empregada em sentido CONOTATIVO?',['A água do rio estava fria.','Coloquei a bebida fria na mesa.','Recebeu do atendente uma resposta fria.','A sala fria incomodava os alunos.','O vento frio chegou no fim da tarde.'],2,'Em “resposta fria”, o adjetivo não indica temperatura, e sim falta de simpatia. É sentido figurado (conotativo). Nas demais, indica temperatura (sentido denotativo).'),

PTQ(6,1,'Em “Li Machado de Assis durante todo o fim de semana”, ocorre',['metáfora.','metonímia.','hipérbole.','antítese.','eufemismo.'],1,'O autor é usado no lugar da obra: é metonímia (autor pela obra).'),
