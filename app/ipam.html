<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Treino e simulado para o concurso do IPAM de Porto Velho, Técnico Autárquico – Administrativa (nível médio), no estilo IBADE.">
<title>Gabarito Mamoré · IPAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Layout: uma coluna de trabalho, estilo folha de respostas. Bolhas A-E como no cartão da prova, tinta azul/preta. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#111a33; --muted:#566079; --line:#d8deeb;
  --accent:#2340d9; --accent-ink:#ffffff; --accent-soft:#e5e9fc;
  --ok:#0f7a58; --ok-soft:#d9f2e8; --bad:#be301d; --bad-soft:#fbe2de; --warn:#9a5600; --warn-soft:#fcebcb;
  --f-display:'Geist','Segoe UI',system-ui,sans-serif;
  --f-body:'Geist','Segoe UI',system-ui,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1224; --surface:#151d36; --ink:#e8ecf8; --muted:#9aa5c2; --line:#27304d;
    --accent:#8296ff; --accent-ink:#0c1224; --accent-soft:#1e2750;
    --ok:#46d3a1; --ok-soft:#12372d; --bad:#ff8c7a; --bad-soft:#40201b; --warn:#f2b45b; --warn-soft:#3a2b10;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1224; --surface:#151d36; --ink:#e8ecf8; --muted:#9aa5c2; --line:#27304d;
  --accent:#8296ff; --accent-ink:#0c1224; --accent-soft:#1e2750;
  --ok:#46d3a1; --ok-soft:#12372d; --bad:#ff8c7a; --bad-soft:#40201b; --warn:#f2b45b; --warn-soft:#3a2b10;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);
  padding-block:18px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,5vw,40px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font:700 26px/1 var(--f-display);letter-spacing:-.045em}
.logo{display:block;flex:none}
.logo .st{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}
.logo .fl{fill:var(--ink);stroke:var(--ink);stroke-linejoin:round}
.logo .ac{fill:var(--accent);stroke:var(--accent);stroke-linejoin:round}
.logo .ck{fill:none;stroke:var(--accent-ink);stroke-linecap:round;stroke-linejoin:round}
.brand span{font:500 12px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.theme{gap:8px;font-size:14px}
.theme svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer;flex:none}
.menu-btn:hover{background:var(--line)}
.menu-btn svg{display:block}
.top .brand{flex:1;min-width:0}
.tabs{position:fixed;top:0;left:0;bottom:0;width:min(280px,84vw);z-index:60;display:flex;flex-direction:column;gap:4px;padding:20px 14px;background:var(--bg);border-right:1px solid var(--line);box-shadow:4px 0 24px rgba(0,0,0,.18);overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
body.menu-open .tabs{transform:none;visibility:visible;transition:transform .22s ease}
.tabs .tabs-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-weight:700}
.scrim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45)}
.scrim[hidden]{display:none}
@media (prefers-reduced-motion:reduce){ .tabs{transition:none} }
.tabs a{padding:12px 14px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:16px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current=page]{background:var(--ink);color:var(--bg)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:10px}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 40px;align-items:end;margin-bottom:36px}
.hero .lead{font-size:18px;color:var(--muted);max-width:52ch;margin-top:12px}
.count{border-left:4px solid var(--ink);padding-left:20px}
.count .big{font:700 clamp(64px,11vw,104px)/0.95 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.count .lbl{font-weight:600;margin-top:6px}
.count .sub{color:var(--muted);font-size:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:420px}
.tbl th{font:600 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.num,.tbl th.num{text-align:right}
.tbl tfoot td{font-weight:700;border-bottom:0}
.sec{margin-top:36px}
.sec>h2{margin-bottom:14px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.act{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;cursor:pointer;text-align:left}
.act:hover{border-color:var(--ink)}
.act b{font:600 18px var(--f-display)}
.act span{color:var(--muted);font-size:15px}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:14px 16px;border-radius:0 10px 10px 0;font-size:15px}
.note b{display:block;margin-bottom:2px}

/* questão */
.qhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.qn{font:600 13px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.qm{font:500 13px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.txt-box{border-left:3px solid var(--line);padding:2px 0 2px 16px;margin:0 0 16px;color:var(--muted);font-size:17px;max-width:68ch}
.txt-box .eyebrow{display:block;margin-bottom:4px}
.enun{font-size:18px;font-weight:500;margin-bottom:18px;max-width:68ch}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.alt:hover{border-color:var(--muted)}
.alt[data-lock]{cursor:default}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font:600 13px var(--f-mono);color:var(--muted);margin-top:-1px}
.alt .t{padding-top:2px;min-width:0}
.alt.sel{border-color:var(--ink);background:var(--accent-soft)}
.alt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.alt.ok{border-color:var(--ok);background:var(--ok-soft)}
.alt.ok .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.alt.bad{border-color:var(--bad);background:var(--bad-soft)}
.alt.bad .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.alt.dim{opacity:.62}
.fb{margin-top:18px;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);max-width:68ch}
.fb b{display:block;margin-bottom:4px}
.fb.good b{color:var(--ok)} .fb.wrong b{color:var(--bad)} .fb.none b{color:var(--warn)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}

/* simulado */
.simbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;padding:10px 0 14px;margin-bottom:6px}
.timer small{display:block;font:600 11px var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.timer b{font:600 30px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.prog{font-size:15px;color:var(--muted)} .prog b{color:var(--ink);font-family:var(--f-mono)}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;align-items:start}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.navgrid button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 12px var(--f-mono);cursor:pointer;padding:0;position:relative}
.navgrid button.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.navgrid button.m::after{content:"";position:absolute;top:2px;right:2px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.navgrid button.c{outline:3px solid var(--accent);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend i.a{background:var(--ink);border-color:var(--ink)} .legend i.m{background:var(--warn);border-radius:50%;border-color:var(--warn)}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.confirm{margin-top:18px;padding:16px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:10px}
.confirm p{margin-bottom:12px}

/* resultado */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score .n{font:700 clamp(56px,10vw,88px)/1 var(--f-display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score .of{font:500 22px var(--f-mono);color:var(--muted)}
.chip{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar .h{display:flex;justify-content:space-between;gap:12px;font-size:15px;margin-bottom:5px}
.bar .h span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.track{height:12px;border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.fill.low{background:var(--warn)}
.rev{display:flex;flex-direction:column;gap:8px}
details.r{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
details.r>summary{cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;list-style:none}
details.r>summary::-webkit-details-marker{display:none}
details.r[open]>summary{border-bottom:1px solid var(--line)}
details.r .body{padding:18px 14px}
.tag{font:600 12px var(--f-mono);padding:2px 8px;border-radius:6px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.none{background:var(--warn-soft);color:var(--warn)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.hist{display:flex;flex-direction:column}
.hist .li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:12px 0;border-bottom:1px solid var(--line)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}

/* cadastro, conta, bancas */
.form{display:flex;flex-direction:column;gap:18px;max-width:560px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.inp{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.inp:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
textarea.inp{min-height:200px;font-family:var(--f-mono);font-size:12px}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--accent)}
.err{color:var(--bad);background:var(--bad-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:24px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;font-size:15px;z-index:20}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bcard{display:flex;flex-direction:column;gap:8px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer}
.bcard:hover{border-color:var(--ink)}
.bcard b{font:700 22px var(--f-display);letter-spacing:-.03em}
.bcard span.s{color:var(--muted);font-size:14px}
.chip.on{background:var(--ok-soft);color:var(--ok)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.chip{align-self:flex-start;font-size:12px;padding:3px 10px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rules li{display:flex;gap:8px;align-items:center;color:var(--muted)}
.rules li::before{content:"○";font-family:var(--f-mono)}
.rules li.ok{color:var(--ok)} .rules li.ok::before{content:"✓"}
.soc{display:flex;flex-direction:column;gap:10px}
.soc .btn[disabled]{justify-content:space-between;width:100%}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.sep::before,.sep::after{content:"";height:1px;background:var(--line);flex:1}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--f-mono);white-space:nowrap;vertical-align:1px}
.badge.soon{background:var(--accent-soft);color:var(--accent)} .badge.off{background:var(--warn-soft);color:var(--warn)}
.aulad{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.aulad>summary{cursor:pointer;font-weight:600;color:var(--accent)}
.aula{margin-top:12px;max-width:68ch;font-size:16px}
.topic .aula p{margin:0 0 12px;color:var(--ink);font-size:16px}
.aula ul{margin:0 0 12px;padding-left:20px}
.aula li{margin-bottom:6px}
.tlink{font:600 17px/1.3 var(--f-body);color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.tlink:hover{text-decoration-color:var(--ink)}
.badge.on{background:var(--ok-soft);color:var(--ok)}
.tsec{margin-top:30px}
.tsec>h2{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tsec .num{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);font:600 14px var(--f-mono)}
.aula-p{max-width:68ch;margin-bottom:14px}
.tsec .aula{max-width:68ch;font-size:17px}
.tsec .aula p{margin:0 0 14px}
.tsec .aula ul{margin:0 0 14px;padding-left:20px}
.tsec .aula li{margin-bottom:8px}
.topics{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.topic.done{background:var(--ok-soft);border-color:var(--ok)}
.topic b{font-weight:600}
.topic p{color:var(--muted);font-size:15px;margin-top:4px;max-width:68ch}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);background:var(--bg);cursor:pointer;display:grid;place-items:center;font:700 16px var(--f-mono);color:var(--surface);padding:0}
.topic.done .tick{background:var(--ok);border-color:var(--ok)}
.policy h2{font-size:18px;margin:26px 0 8px}
.policy p,.policy li{max-width:68ch}
.policy ul{margin:8px 0;padding-left:20px}
details.pol{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:20px;max-width:560px}
details.pol>summary{cursor:pointer;padding:14px 18px;font-weight:600}
details.pol .policy{padding:0 18px 18px}

.enun,.txt-box{white-space:pre-line}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .acts{grid-template-columns:1fr}
  .simwrap{grid-template-columns:1fr}
  aside.side{position:static}
}
@media (prefers-reduced-motion:no-preference){ .fill{transition:width .5s ease} }
</style>
<style>table.tbl{min-width:0} .tbl th,.tbl td{padding-left:8px;padding-right:8px} @media (max-width:520px){.tbl th{letter-spacing:.02em;font-size:11px}}</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="menu-btn" id="menu-open" type="button" data-act="menu" aria-label="Abrir menu" aria-controls="menu" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><circle cx="10" cy="3.5" r="2"/><circle cx="10" cy="10" r="2"/><circle cx="10" cy="16.5" r="2"/></svg></button>
    <div class="brand">
      
      <b>Gabarito Mamoré</b><span>IPAM</span></div>
    <nav class="tabs" id="menu" aria-label="Seções">
      <div class="tabs-h"><span>Menu</span><button class="menu-btn" type="button" data-act="menu" aria-label="Fechar menu">✕</button></div>
      <a href="#inicio" data-v="inicio">Início</a>
      <a href="#estudar" data-v="estudar">Estudar</a>
      <a href="#treino" data-v="treino">Treino</a>
      <a href="#simulado" data-v="simulado">Simulado</a>
      <a href="#desempenho" data-v="desempenho">Desempenho</a>
      <a href="./">← Gabarito Porto Velho</a>
    </nav>
    <button class="btn sm theme" id="theme" data-act="theme" type="button"></button>
  </header>
  <main id="root"></main>
  <div class="scrim" id="scrim" data-act="menu" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>
<script>
/* ===== Matérias do edital IPAM 001/2026 (IBADE), Técnico Autárquico, nível médio ===== */
const MAT = {
  pt:{n:'Língua Portuguesa', w:1, sim:10}, rl:{n:'Raciocínio Lógico e Matemático', w:1, sim:5}, inf:{n:'Informática Básica', w:1, sim:5},
  adm:{n:'Noções de Administração Pública, Atendimento e Ética', w:1, sim:5},
  leg:{n:'Noções de Legislação Institucional, Previdenciária e de Assistência à Saúde', w:1, sim:5},
  esp:{n:'Conhecimentos Específicos (Administrativa)', w:2, sim:50}
};
let _ip = 0;
/* Q(matéria, enunciado, correta, [4 erradas], explicação): a posição da correta gira entre A e E */
const Q = (m, e, ok, bad, x) => { const n = ++_ip, pos = (n*3+1)%5, a = bad.slice(); a.splice(pos, 0, ok); return {id:'ip'+n, m, e, a, g:pos, x}; };

/* ---- Conhecimentos Específicos: Atendimento ---- */
Q('esp','A escuta ativa, no atendimento ao público, consiste em:','prestar atenção ao que a pessoa diz, sem interromper, e confirmar o entendimento',['ouvir só o início da fala e responder logo, para ganhar tempo','falar mais do que o usuário, para conduzir o atendimento','anotar tudo o que ouve sem demonstrar nenhum interesse','concordar com tudo o que o usuário diz, para evitar conflito'],'Escutar com atenção reduz erros e retrabalho e melhora a relação com o usuário.'),
Q('esp','Entre os idosos, a Lei nº 10.741/2003 (Estatuto da Pessoa Idosa) assegura prioridade especial às pessoas com idade igual ou superior a:','80 anos',['60 anos','65 anos','70 anos','75 anos'],'A prioridade geral é para quem tem 60 anos ou mais. Entre eles, os maiores de 80 têm preferência especial (art. 3º, § 2º).'),
Q('esp','Têm direito a atendimento prioritário, nos termos da Lei nº 10.048/2000, entre outras pessoas:','gestantes, lactantes, pessoas com deficiência e pessoas com criança de colo',['apenas as pessoas com mais de 70 anos de idade','os servidores do próprio órgão onde são atendidos','os usuários que chegaram primeiro ao atendimento','as pessoas que forem indicadas pela chefia do setor'],'Também têm prioridade os idosos com idade igual ou superior a 60 anos e as pessoas obesas.'),
Q('esp','No atendimento telefônico, a conduta adequada do servidor é:','identificar-se e avisar antes de colocar a ligação em espera',['atender sem se identificar, para ganhar tempo','deixar o telefone tocar até que outro servidor atenda','interromper a fala do usuário para agilizar a ligação','dar dados de segurados a qualquer pessoa que ligue'],'Cortesia e clareza valem tanto no atendimento remoto quanto no presencial.'),
Q('esp','Ao orientar um usuário sobre procedimentos previdenciários, o servidor deve:','usar linguagem simples e evitar termos técnicos que o usuário não conheça',['usar o maior número possível de siglas e termos jurídicos','falar rapidamente, para não ocupar o balcão por muito tempo','repetir o texto da lei, sem nenhuma explicação adicional','indicar que ele consulte a internet, sem orientá-lo'],'Orientar é fazer o usuário entender o que precisa fazer.'),
Q('esp','O servidor que não souber responder a uma dúvida do usuário deve:','consultar a norma ou o setor competente e informar o dado correto',['dar uma resposta aproximada, para não demonstrar desconhecimento','pedir que o usuário volte outro dia, sem dar explicações','indicar a resposta que lhe parecer mais provável no momento','encerrar o atendimento, alegando falta de tempo'],'Uma informação errada pode prejudicar o direito do segurado.'),
Q('esp','Os dados de um segurado, como benefícios e informações de saúde, podem ser fornecidos:','ao titular ou a quem tenha autorização ou representação legal, após identificação',['a qualquer pessoa que diga ser parente do segurado','a vizinhos ou conhecidos que procurarem o servidor','a quem telefonar sabendo o nome completo do segurado','a qualquer pessoa, desde que peça com educação e cordialidade'],'O sigilo funcional e a LGPD exigem identificação e autorização.'),
Q('esp','Em uma equipe de trabalho, a atitude que mais contribui para um ambiente colaborativo é:','compartilhar informações, respeitar diferenças e apoiar os colegas nas demandas',['reter informações importantes para se destacar perante a chefia','criticar os colegas na frente dos usuários do serviço','cumprir só a própria tarefa, sem se interessar pelo setor','evitar o diálogo com a chefia e com os colegas de outros setores'],'O trabalho em equipe é um dos pontos do edital (Administração Pública, Atendimento e Ética).'),
Q('esp','Diante de um conflito entre dois colegas, a atitude mais adequada de um servidor é:','buscar o diálogo respeitoso e, se necessário, levar o caso à chefia',['tomar o partido de um dos colegas, para encerrar a discussão','ignorar o fato e fingir que nada aconteceu no setor','expor a situação aos usuários que aguardam atendimento','responder com ironia, para constranger quem começou'],'A solução de conflitos pressupõe respeito, escuta e, se preciso, mediação da chefia.'),
Q('esp','A “primeira impressão” no atendimento ao público refere-se principalmente:','à postura, à cordialidade e à apresentação do servidor no início do contato',['ao número de documentos exigidos do usuário no balcão','ao tempo de espera do usuário na fila de atendimento','à quantidade de assinaturas existentes em cada processo','ao custo do serviço que está sendo prestado ao usuário'],'O primeiro contato influencia a confiança do usuário.'),
/* ---- Protocolo e processos administrativos ---- */
Q('esp','Autuação é a operação em que:','se forma o processo, com capa, numeração e juntada dos documentos de origem',['se arquivam definitivamente os documentos do órgão','se eliminam os documentos de pouca importância no arquivo','se devolve ao interessado o documento que ele apresentou','se assina digitalmente o documento recebido no protocolo'],'É o ato de formar o processo a partir de um documento ou requerimento.'),
Q('esp','A juntada, em um processo administrativo, é o ato de:','anexar um documento ao processo, em ordem, com numeração e rubrica das folhas',['retirar um documento do processo, com registro da retirada','destruir documentos duplicados que estão nos autos do processo','enviar o processo ao arquivo permanente do órgão','autorizar a eliminação dos documentos já vencidos no arquivo'],'A retirada de documento é o desentranhamento.'),
Q('esp','O desentranhamento de um documento de um processo é:','a retirada do documento dos autos, com o devido registro',['a união provisória de dois processos em tramitação','a anexação de um documento novo ao processo, em ordem','o arquivamento do processo, após a decisão final','a numeração sequencial das folhas do processo'],'Deve ser feito mediante despacho e com registro, para preservar a numeração e a integridade do processo.'),
Q('esp','A apensação é a união:','provisória de um processo a outro, para tramitação conjunta, sem perda de identidade',['definitiva de dois processos, que passam a formar um só','de um documento ao processo, na ordem de numeração das folhas','da cópia de um processo ao respectivo processo original','de dois documentos de assuntos diferentes em um único volume'],'Na terminologia usual, a união definitiva é a anexação; a apensação é provisória.'),
Q('esp','As atividades do setor de protocolo compreendem:','recebimento, registro, classificação, distribuição e controle da tramitação',['apenas a guarda definitiva de todos os documentos do órgão','somente a elaboração dos ofícios assinados pela chefia','a eliminação dos documentos considerados sem valor','a decisão sobre o mérito dos requerimentos recebidos'],'O protocolo é a porta de entrada e o controle de circulação dos documentos.'),
Q('esp','O despacho, em um processo, é:','o ato que encaminha o processo ou decide questão de rotina, feito por quem tem competência',['o resumo do processo, elaborado pelo arquivo do órgão','o documento que inicia o processo, apresentado pelo interessado','a cópia autenticada do processo, entregue ao requerente','a lista de documentos que o requerente precisa apresentar'],'Despacho é o ato de encaminhamento ou de decisão de menor complexidade.'),
Q('esp','Na numeração das folhas de um processo físico, deve-se:','numerá-las em sequência, na ordem de juntada, com rubrica de quem numerou',['numerar só a primeira e a última folha de cada volume','numerar a lápis, para poder alterar a ordem quando quiser','deixar as folhas sem número, para facilitar novas juntadas','numerar por documento, e não por folha, em cada volume'],'A numeração sequencial garante a integridade e permite verificar se houve perda de folhas.'),
Q('esp','Na Lei nº 9.784/1999, o prazo para interposição de recurso administrativo, salvo disposição legal específica, é de:','10 dias, contados da ciência ou da divulgação oficial da decisão',['3 dias úteis, contados da data da decisão proferida','5 dias corridos, contados do protocolo do recurso','20 dias úteis, contados do recebimento da notificação','30 dias corridos, contados da data de publicação'],'Art. 59 da Lei 9.784/1999. A lei se aplica ao processo federal; em outros entes, vale a norma local e, na ausência dela, costuma ser usada por analogia.'),
Q('esp','Na contagem de prazos em processo administrativo, em regra:','exclui-se o dia do começo e inclui-se o do vencimento',['inclui-se o dia do começo e exclui-se o do vencimento','incluem-se o dia do começo e o do vencimento','excluem-se o dia do começo e o do vencimento','contam-se apenas os sábados, domingos e feriados'],'Art. 66 da Lei 9.784/1999: os prazos começam a correr a partir da data da cientificação oficial, excluído o dia do começo e incluído o do vencimento.'),
Q('esp','Nos processos eletrônicos, a assinatura digital com certificado digital serve para:','comprovar a autoria e a integridade do documento assinado',['impedir que o documento seja lido por outras pessoas','aumentar a velocidade de tramitação do processo no sistema','substituir a necessidade de registro do documento no sistema','eliminar a necessidade de protocolo do documento no órgão'],'Assinar digitalmente garante quem assinou e que o documento não foi alterado.'),
/* ---- Gestão documental ---- */
Q('esp','Conforme a Lei nº 8.159/1991, a gestão de documentos é o conjunto de procedimentos referentes:','à produção, à tramitação, ao uso, à avaliação e ao arquivamento, até a eliminação ou guarda permanente',['somente à digitalização dos documentos produzidos no órgão','apenas ao armazenamento dos documentos em serviços de nuvem','exclusivamente à eliminação dos documentos sem valor','à guarda de documentos de interesse histórico do município'],'Art. 3º da Lei 8.159/1991.'),
Q('esp','Na teoria das três idades, o arquivo corrente é aquele que:','reúne documentos em tramitação ou de uso frequente pelo setor que os produziu',['guarda documentos sem uso, que aguardam a eliminação','guarda documentos de valor histórico, de forma definitiva','guarda as cópias de segurança dos documentos eletrônicos','reúne documentos recebidos de outros órgãos públicos'],'Fases: corrente (uso frequente), intermediária (uso eventual, aguardando prazos) e permanente (valor histórico).'),
Q('esp','O arquivo permanente destina-se a:','guardar definitivamente os documentos de valor histórico, probatório ou informativo',['guardar os documentos até que sejam eliminados do órgão','guardar os documentos que estão em uso diário no setor','receber as cópias dos documentos já digitalizados','guardar apenas os documentos recebidos de outros órgãos'],'A guarda permanente ocorre depois da avaliação, com destinação final definida.'),
Q('esp','A tabela de temporalidade de documentos tem como finalidade:','definir os prazos de guarda dos documentos e a sua destinação final',['numerar as folhas dos processos em tramitação no órgão','registrar o horário de entrada e saída dos servidores','classificar os documentos pela cor da pasta de arquivo','indicar quais servidores podem assinar cada documento'],'É um instrumento de avaliação: sem ela, não é adequado eliminar documentos.'),
Q('esp','O plano de classificação de documentos serve para:','organizar os documentos conforme as funções e atividades do órgão',['definir o horário de funcionamento do arquivo do órgão','registrar a retirada de documentos do arquivo por usuários','classificar os documentos como sigilosos ou ostensivos','cadastrar os usuários que consultam o arquivo do órgão'],'A classificação define em qual assunto (código) o documento é arquivado.'),
Q('esp','A eliminação de documentos públicos deve ocorrer:','somente após a avaliação, conforme a tabela de temporalidade e com autorização',['quando o setor precisar de mais espaço para guardar documentos','a critério do servidor responsável pelo arquivo do órgão','sempre que o documento tiver mais de um ano de existência','de acordo com a preferência da chefia imediata do setor'],'Eliminar sem autorização e sem critérios pode causar perda de provas e responsabilização.'),
Q('esp','Entre os cuidados de conservação de documentos em papel, destaca-se:','evitar umidade, calor, luz excessiva, poeira e insetos',['guardar os documentos sempre próximos a janelas, para ventilar','consertar páginas rasgadas com fitas adesivas comuns','empilhar os documentos sem proteção, para economizar espaço','guardar os documentos no chão, para facilitar o acesso'],'Umidade e luz aceleram a deterioração do papel.'),
Q('esp','O acesso a documentos que contenham dados pessoais de segurados deve ser:','restrito a quem tenha necessidade e autorização, com sigilo e LGPD',['livre a qualquer servidor do órgão, em qualquer setor','livre ao público externo, desde que peça com educação','permitido apenas à chefia, sem nenhum tipo de registro','dependente da vontade do usuário, sem exigir identificação'],'O acesso deve ser controlado e registrado, conforme a necessidade de cada função.'),
/* ---- Redação oficial ---- */
Q('esp','De acordo com o Manual de Redação da Presidência da República, são características da redação oficial:','impessoalidade, formalidade, padronização, clareza e concisão',['pessoalidade, informalidade, regionalismos e ornamentos','subjetividade, emoção, gírias e abreviações frequentes','persuasão, humor, criatividade e linguagem informal','expressividade, siglas em excesso e longas explicações'],'Texto oficial é impessoal, formal, claro e conciso, em padrão culto.'),
Q('esp','Segundo o Manual de Redação da Presidência da República, o ofício é o tipo de documento usado para:','a comunicação entre órgãos públicos e entre estes e particulares',['a comunicação interna entre setores do mesmo órgão','o registro das decisões tomadas em uma reunião','a divulgação de normas a vários destinatários','a comprovação de um fato por quem tem competência'],'Memorando é comunicação interna; ata registra reuniões; circular é para vários destinatários.'),
Q('esp','O memorando destina-se a:','comunicações entre unidades administrativas de um mesmo órgão',['comunicações do órgão com particulares e empresas','o registro das decisões tomadas em uma reunião','a emissão de atestados e de certidões a usuários','a transmissão de normas gerais para a população'],'O memorando é interno, mais ágil e menos formal que o ofício.'),
Q('esp','A certidão é o documento pelo qual:','a autoridade competente atesta fatos que constam de registros ou processos do órgão',['um servidor requer um direito a uma autoridade superior','o órgão convoca os interessados para uma reunião de trabalho','a chefia encaminha um processo a outro setor do órgão','se resumem as decisões tomadas em uma reunião de equipe'],'A certidão reproduz o que está registrado. A declaração é feita sob a responsabilidade de quem declara.'),
Q('esp','Pelo Manual de Redação da Presidência da República, o fecho “Respeitosamente,” é usado em comunicações dirigidas:','a autoridades superiores, inclusive o Presidente da República',['a autoridades da mesma hierarquia do remetente','a pessoas de hierarquia inferior à do remetente','a particulares, em qualquer comunicação oficial','apenas a colegas do mesmo setor de trabalho'],'Já “Atenciosamente,” é para as autoridades de mesma hierarquia ou de hierarquia inferior.'),
Q('esp','O pronome de tratamento “Vossa Senhoria” é adequado para:','autoridades e particulares em geral, nas comunicações formais',['somente o Presidente da República e os governadores','somente os Ministros de Estado e os Secretários','somente os magistrados e os membros do Ministério Público','somente os parentes e os amigos dos servidores'],'“Vossa Excelência” é para autoridades de maior hierarquia. Os pronomes levam o verbo na 3ª pessoa.'),
Q('esp','O relatório, na rotina administrativa, tem como finalidade:','expor de forma organizada e objetiva as atividades feitas ou os fatos apurados',['convocar os servidores para uma reunião no setor','pedir autorização para o afastamento de um servidor','certificar documentos que constam nos arquivos do órgão','distribuir tarefas entre os servidores de cada setor'],'Um relatório simples costuma trazer identificação, descrição dos fatos, resultados e conclusão.'),
Q('esp','O requerimento é o documento em que:','o interessado dirige a uma autoridade um pedido de direito ou providência',['a chefia concede uma licença a um servidor do órgão','o órgão comprova um fato registrado em seus arquivos','o servidor responde a uma notificação recebida do órgão','a chefia convoca a equipe para uma reunião de trabalho'],'O requerimento inicia muitos processos administrativos e pede deferimento.'),
/* ---- Materiais e patrimônio ---- */
Q('esp','No método PEPS de controle de estoques:','o primeiro item a entrar é o primeiro a sair',['o último item a entrar é o primeiro a sair','o item de maior valor é o primeiro a sair','o item de menor valor é o primeiro a sair','o item de maior volume é o primeiro a sair'],'PEPS = primeiro que entra, primeiro que sai. Evita o vencimento de materiais.'),
Q('esp','Na classificação ABC de estoques, os itens da classe A são:','os de maior valor de consumo, em pequeno número, com controle mais rigoroso',['os de menor valor e em maior quantidade, com controle simples','os que não podem ser adquiridos pelo órgão nem comprados','os itens perecíveis, que devem ser consumidos em poucos dias','os de maior volume físico, que ocupam mais espaço no almoxarifado'],'Poucos itens respondem por boa parte do valor: por isso a classe A merece mais atenção.'),
Q('esp','O tombamento de bens patrimoniais consiste em:','registrar o bem permanente no patrimônio do órgão, com número de identificação',['dar baixa no bem, por perda, roubo ou inutilização','vender o bem em leilão público, por preço mínimo','emprestar o bem a outro órgão, por prazo determinado','destruir o bem que já não tem utilidade para o órgão'],'Tombar é incorporar e identificar o bem ao patrimônio; baixar é retirá-lo.'),
Q('esp','O inventário físico de materiais e bens tem como objetivo:','conferir quantidade e estado dos itens, comparando com os registros',['definir o preço de venda dos itens que o órgão possui','substituir a necessidade de controle das entradas e saídas','eliminar os itens usados e os que estão sem utilização','aumentar o volume do estoque que está no almoxarifado'],'É a contagem real comparada ao que consta nos controles.'),
Q('esp','O material de consumo, diferentemente do material permanente:','perde a identidade física ou se esgota em curto prazo, como o papel e a caneta',['tem durabilidade superior a dois anos, como mesas e armários','é sempre registrado como patrimônio, com número de tombamento','é utilizado apenas pelos servidores ocupantes de cargos em comissão','só pode ser adquirido por meio de pregão eletrônico'],'Mesa, computador e armários são, em regra, bens permanentes.'),
Q('esp','O estoque mínimo, em um almoxarifado, é:','a quantidade de segurança que evita a falta de materiais até a chegada do reabastecimento',['a quantidade que nunca pode ser consumida pelos setores','o valor mínimo de compra que se aceita em cada pedido','a quantidade máxima que o almoxarifado consegue guardar','o conjunto de materiais que está sem uso há mais de um ano'],'Ao atingir o ponto de pedido, deve-se solicitar nova compra.'),
/* ---- Compras e contratos ---- */
Q('esp','Entre as modalidades da Lei nº 14.133/2021, a adequada para a aquisição de bens e serviços comuns é:','o pregão',['o concurso','o leilão','o diálogo competitivo','a tomada de preços'],'Bens e serviços comuns têm padrões de desempenho definidos objetivamente. A tomada de preços não existe mais na Lei 14.133.'),
Q('esp','A contratação direta, sem licitação, por inexigibilidade, ocorre quando:','há inviabilidade de competição',['o valor da compra é muito alto','o órgão tem pressa em comprar','o fornecedor já foi contratado antes','a chefia prefere um fornecedor'],'Art. 74 da Lei 14.133/2021. Dispensa é diferente: a competição é possível, mas a lei a dispensa (art. 75).'),
Q('esp','Na Lei nº 14.133/2021, a fase em que se elabora o estudo técnico preliminar e se define o objeto da contratação é a fase:','preparatória',['recursal','de homologação','de habilitação','de divulgação do edital'],'Art. 17: preparatória; divulgação do edital; apresentação de propostas e lances; julgamento; habilitação; recursal; homologação.'),
Q('esp','O fiscal do contrato administrativo tem como atribuição:','acompanhar a execução do contrato e verificar se o objeto é cumprido como pactuado',['escolher o fornecedor da contratação sem fazer licitação','aprovar o orçamento anual do órgão contratante','assinar os contratos em nome da chefia do órgão','julgar as propostas apresentadas na licitação'],'A fiscalização do contrato é prevista no art. 117 da Lei 14.133/2021.'),
Q('esp','A ata de registro de preços:','registra o compromisso de fornecimento, que a Administração usa conforme a necessidade',['obriga a Administração a comprar toda a quantidade registrada','é um contrato de obra de grande valor, assinado com o vencedor','dispensa o fornecimento, mas obriga o pagamento ao fornecedor','substitui o empenho da despesa no momento do pagamento'],'O registro de preços permite contratar de acordo com a demanda, sem obrigação de compra total.'),
Q('esp','Para o controle de contratos, é uma boa prática do setor administrativo:','manter registro da vigência, dos prazos de renovação e dos pagamentos',['guardar os contratos apenas com o fornecedor contratado','contratar sem acompanhar o prazo de cada contrato','renovar os contratos sem nenhuma avaliação prévia','deixar o controle dos prazos a cargo do fornecedor'],'Controlar vigência evita contratos vencidos e serviços sem cobertura.'),
/* ---- Previdência e assistência (nível operacional) ---- */
Q('esp','A filiação do servidor titular de cargo efetivo ao regime próprio de previdência social:','é automática e obrigatória, a partir do exercício do cargo',['depende de pedido do servidor, que pode ser feito a qualquer tempo','é facultativa, e o servidor pode cancelá-la quando quiser','ocorre somente após cinco anos de efetivo exercício do cargo','exige o pagamento de taxa de inscrição pelo servidor'],'A filiação é compulsória. A contribuição é obrigatória para os segurados ativos.'),
Q('esp','Na rotina previdenciária, são provas documentais usuais da condição de dependente:','a certidão de nascimento, a de casamento e documentos que comprovem a relação',['apenas uma declaração verbal feita pelo próprio segurado','somente o comprovante de residência do segurado','a carteira de identidade do servidor segurado','o contracheque de qualquer pessoa da família do segurado'],'Os documentos exigidos variam conforme o dependente e a lei do regime.'),
Q('esp','O recadastramento (ou prova de vida) de aposentados e pensionistas tem como finalidade:','atualizar os dados e confirmar a existência do beneficiário, evitando pagamentos indevidos',['aumentar o valor do benefício pago a cada beneficiário','cobrar uma taxa anual de todos os beneficiários cadastrados','cancelar o benefício sem processo administrativo prévio','extinguir o direito à aposentadoria dos beneficiários'],'É um controle comum nos regimes previdenciários, conforme as regras de cada ente.'),
Q('esp','A manutenção e a revisão de direitos previdenciários envolvem, na prática administrativa:','análise do pedido, conferência dos documentos, instrução e decisão da autoridade competente',['a concessão automática do pedido, sem nenhuma análise','a decisão do servidor do balcão de atendimento, sozinho','a revisão por ordem de quem protocolou o pedido','o arquivamento do pedido, sem decisão da autoridade'],'A decisão é de quem tem competência, com instrução do processo e registro.'),
Q('esp','A compensação previdenciária (Lei nº 9.796/1999) ocorre:','entre o Regime Geral e os regimes próprios, quando há contagem recíproca de tempo',['entre dois bancos privados, em operações de crédito consignado','entre o servidor e o ente federativo, em caso de atraso salarial','entre dois municípios, para repasse de verbas da saúde','entre o segurado e o plano de saúde que ele utiliza'],'O regime que concede o benefício compensa o regime de origem do tempo, proporcionalmente.'),
Q('esp','O servidor que atende um segurado e conhece a situação de saúde dele deve:','guardar sigilo e não divulgar a informação a quem não tenha necessidade ou autorização',['comentar o caso com os colegas, para obter opiniões sobre ele','divulgar a situação, se o assunto parecer de interesse público','comentar o caso com amigos, sem citar o nome do segurado','publicar a situação nas redes sociais, sem citar o nome dele'],'O sigilo funcional e a proteção de dados se aplicam a todos que tratam as informações.'),
Q('esp','Ao tratar dados pessoais de segurados e dependentes, o IPAM, como órgão público, deve:','tratar apenas os dados necessários à finalidade, com segurança e transparência',['coletar o maior número possível de dados, por precaução','compartilhar os dados com empresas interessadas, mediante pagamento','manter os dados indefinidamente, mesmo sem necessidade','deixar os dados sem controle de acesso, para facilitar a consulta'],'São princípios da LGPD: finalidade, adequação, necessidade, segurança e transparência.'),
Q('esp','O atendimento aos usuários da assistência à saúde administrada pelo IPAM envolve, em geral, orientação sobre:','quem pode usar o serviço, os dependentes, o custeio e os procedimentos de utilização',['a emissão de multas de trânsito e a cobrança de tributos','o registro de empresas e a abertura de novos negócios','a concessão de crédito consignado e o financiamento de imóveis','a matrícula em escolas e o transporte escolar municipal'],'O tema consta no edital. Confira a LC 841/2021 e as normas do FAS para os detalhes.'),
];
